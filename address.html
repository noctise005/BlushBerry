<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Address | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
        }

        .navbar-brand {
            color: #f83f76;
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar-brand:hover {
            color: #f83f76;
        }


        /* =========================
           BLUSHBERRY BUTTON
           ========================= */

        .bb-btn {

            display: inline-block;

            background: #fff8fb;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 9px 20px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 500;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.2s ease;

        }

        .bb-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }

        .bb-btn:active {

            background: #f83f76 !important;

            color: white !important;

            border-color: #f83f76 !important;

        }

        .bb-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            box-shadow: 0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        /* =========================
           PAGE TITLE
           ========================= */

        .page-title {

            color: #f83f76;

            font-weight: bold;

            margin-top: 40px;

            margin-bottom: 35px;

            text-align: center;

        }


        /* =========================
           ADDRESS CARD
           ========================= */

        .address-card {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);

            margin-bottom: 25px;

            transition: .3s;

        }

        .address-card:hover {

            transform: translateY(-5px);

        }


        /* =========================
           DEFAULT BADGE
           ========================= */

        .default {

            background: #f83f76;

            color: white;

            padding: 5px 15px;

            border-radius: 20px;

            font-size: 14px;

        }


        /* =========================
           ACTION BUTTONS
           ========================= */

        .action-btn {

            background: #f83f76;

            color: white;

            border: 1.5px solid #f83f76;

            border-radius: 12px;

            padding: 9px 20px;

            margin-right: 10px;

            transition: all 0.2s ease;

        }

        .action-btn:hover {

            background: #fff8fb;

            color: #f83f76;

            border-color: #f83f76;

        }


        /* =========================
           DELETE BUTTON
           ========================= */

        .delete-btn {

            background: #f83f76;

            border-color: #f83f76;

        }

        .delete-btn:hover {

            background: #fff8fb;

            color: #f83f76;

            border-color: #f83f76;

        }


        /* =========================
           ADD ADDRESS BUTTON
           ========================= */

        .add-btn {

            background: #f83f76;

            color: white;

            padding: 12px 28px;

            border-radius: 12px;

            font-weight: 600;

            border: 1.5px solid #f83f76;

            transition: all 0.2s ease;

        }

        .add-btn:hover {

            background: #fff8fb;

            color: #f83f76;

            border-color: #f83f76;

        }


        /* =========================
           EMPTY MESSAGE
           ========================= */

        .empty-message {

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);

        }

        .empty-message h4 {

            color: #f83f76;

        }


        /* =========================
           FOOTER SPACE
           ========================= */

        .footer-space {

            height: 50px;

        }
    </style>

</head>


<body>


    <!-- =========================
     NAVBAR
     ========================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                🌸 BlushBerry

            </a>


            <a href="profile.html" class="bb-btn">

                ← Go Back

            </a>

        </div>

    </nav>



    <!-- =========================
     PAGE
     ========================= -->

    <div class="container">


        <h2 class="page-title">

            📍 Saved Addresses

        </h2>


        <!-- ADDRESSES -->

        <div id="addressContainer"></div>


        <!-- ADD ADDRESS -->

        <div class="text-center mt-5">

            <button class="btn add-btn" onclick="addAddress()">

                <i class="fa-solid fa-plus"></i>

                Add New Address

            </button>

        </div>


        <div class="footer-space"></div>

    </div>



    <script>


        // =====================================
        // LOAD SAVED ADDRESSES
        // =====================================

        let addresses =
            JSON.parse(
                localStorage.getItem("addresses")
            ) || [];


        // =====================================
        // FIRST TIME DEFAULT ADDRESS
        // =====================================

        const addressesInitialized =
            localStorage.getItem("addressesInitialized");


        if (
            addresses.length === 0 &&
            !addressesInitialized
        ) {

            addresses = [

                {
                    id: Date.now(),

                    name: "Lily",

                    address:
                        "123, Rose Garden Apartment",

                    city:
                        "MG Road, Akola",

                    state:
                        "Maharashtra - 411001",

                    phone:
                        "+91 9876543210",

                    default: true
                },


                {
                    id: Date.now() + 1,

                    name: "Office Address",

                    address:
                        "45, Business Tower",

                    city:
                        "Baner Road, Pune",

                    state:
                        "Maharashtra - 411045",

                    phone:
                        "+91 9876501234",

                    default: false
                }

            ];

            saveAddresses();

            localStorage.setItem(
                "addressesInitialized",
                "true"
            );

        }


        // =====================================
        // SAVE ADDRESSES
        // =====================================

        function saveAddresses() {

            localStorage.setItem(
                "addresses",
                JSON.stringify(addresses)
            );

        }


        // =====================================
        // DISPLAY ADDRESSES
        // =====================================

        function displayAddresses() {

            const container =
                document.getElementById(
                    "addressContainer"
                );

            container.innerHTML = "";


            if (addresses.length === 0) {

                container.innerHTML = `

            <div class="empty-message">

                <h4>
                    📍 No Saved Addresses
                </h4>

                <p>
                    Add an address to make checkout easier.
                </p>

            </div>

        `;

                return;

            }


            addresses.forEach((item, index) => {

                const card = `

            <div class="address-card">

                <div class="d-flex justify-content-between">

                    <h5>
                        ${item.name}
                    </h5>

                    ${item.default
                        ? `<span class="default">
                            Default
                           </span>`
                        : ""
                    }

                </div>


                <p>

                    ${item.address}<br>

                    ${item.city}<br>

                    ${item.state}<br>

                    Phone: ${item.phone}

                </p>


                <button
                    class="btn action-btn"
                    onclick="editAddress(${index})">

                    <i class="fa-solid fa-pen"></i>

                    Edit

                </button>


                <button
                    class="btn action-btn delete-btn"
                    onclick="deleteAddress(${index})">

                    <i class="fa-solid fa-trash"></i>

                    Delete

                </button>

            </div>

        `;

                container.innerHTML += card;

            });

        }


        // =====================================
        // ADD ADDRESS
        // =====================================

        function addAddress() {

            const name =
                prompt("Enter name:");

            if (!name) {
                return;
            }


            const address =
                prompt("Enter address:");

            if (!address) {
                return;
            }


            const city =
                prompt("Enter city:");

            if (!city) {
                return;
            }


            const state =
                prompt("Enter state and pincode:");

            if (!state) {
                return;
            }


            const phone =
                prompt("Enter phone number:");

            if (!phone) {
                return;
            }


            const newAddress = {

                id: Date.now(),

                name: name,

                address: address,

                city: city,

                state: state,

                phone: phone,

                default: addresses.length === 0

            };


            addresses.push(newAddress);

            saveAddresses();

            displayAddresses();

        }


        // =====================================
        // EDIT ADDRESS
        // =====================================

        function editAddress(index) {

            const item =
                addresses[index];


            const name =
                prompt(
                    "Enter name:",
                    item.name
                );

            if (!name) {
                return;
            }


            const address =
                prompt(
                    "Enter address:",
                    item.address
                );

            if (!address) {
                return;
            }


            const city =
                prompt(
                    "Enter city:",
                    item.city
                );

            if (!city) {
                return;
            }


            const state =
                prompt(
                    "Enter state and pincode:",
                    item.state
                );

            if (!state) {
                return;
            }


            const phone =
                prompt(
                    "Enter phone number:",
                    item.phone
                );

            if (!phone) {
                return;
            }


            item.name = name;

            item.address = address;

            item.city = city;

            item.state = state;

            item.phone = phone;


            saveAddresses();

            displayAddresses();

        }


        // =====================================
        // DELETE ADDRESS
        // =====================================

        function deleteAddress(index) {

            const item =
                addresses[index];


            const confirmDelete =
                confirm(
                    "Delete " +
                    item.name +
                    " address?"
                );


            if (!confirmDelete) {
                return;
            }


            addresses.splice(index, 1);


            // Make first remaining address default

            if (addresses.length > 0) {

                addresses[0].default = true;

            }


            saveAddresses();

            displayAddresses();

        }


        // =====================================
        // DISPLAY ON PAGE LOAD
        // =====================================

        displayAddresses();

    </script>


    <script src="js/theme.js"></script>

</body>

</html>
