<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Address | BlushBerry</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>
        /* =========================
           BODY
           ========================= */

        body {

            background: #fff8fb;

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 0;

            overflow-x: hidden;

        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {

            background: white;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, .08);

        }


        .navbar .container {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

        }


        .navbar-brand {

            color: #f83f76;

            font-size: 30px;

            font-weight: bold;

            text-decoration: none;

            white-space: nowrap;

        }


        .navbar-brand:hover {

            color: #f83f76;

        }


        /* =========================
           BLUSHBERRY BUTTON
           ========================= */

        .bb-btn {

            display: inline-block;

            background: #fff8fb;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 9px 20px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 500;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.2s ease;

            white-space: nowrap;

        }


        .bb-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }


        .bb-btn:active {

            background: #f83f76 !important;

            color: white !important;

            border-color: #f83f76 !important;

        }


        .bb-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        /* =========================
           PAGE TITLE
           ========================= */

        .page-title {

            color: #f83f76;

            font-weight: bold;

            margin-top: 40px;

            margin-bottom: 35px;

            text-align: center;

        }


        /* =========================
           ADDRESS CARD
           ========================= */

        .address-card {

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .08);

            margin-bottom: 25px;

            transition: .3s;

        }


        .address-card:hover {

            transform: translateY(-5px);

        }


        /* =========================
           ADDRESS HEADER
           ========================= */

        .address-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 15px;

        }


        .address-header h5 {

            margin: 0;

            font-weight: 600;

            word-break: break-word;

        }


        /* =========================
           DEFAULT BADGE
           ========================= */

        .default {

            background: #f83f76;

            color: white;

            padding: 5px 15px;

            border-radius: 20px;

            font-size: 14px;

            white-space: nowrap;

            flex-shrink: 0;

        }


        /* =========================
           ADDRESS TEXT
           ========================= */

        .address-details {

            color: #555;

            line-height: 1.7;

            margin-bottom: 20px;

            overflow-wrap: anywhere;

        }


        /* =========================
           ACTION BUTTONS
           ========================= */

        .address-actions {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

        }


        .action-btn {

            background: #f83f76;

            color: white;

            border: 1.5px solid #f83f76;

            border-radius: 12px;

            padding: 9px 20px;

            transition: all 0.2s ease;

            margin: 0;

        }


        .action-btn:hover {

            background: #fff8fb;

            color: #f83f76;

            border-color: #f83f76;

        }


        /* =========================
           DELETE BUTTON
           ========================= */

        .delete-btn {

            background: #f83f76;

            border-color: #f83f76;

        }


        .delete-btn:hover {

            background: #fff8fb;

            color: #f83f76;

            border-color: #f83f76;

        }


        /* =========================
           ADD ADDRESS BUTTON
           ========================= */

        .add-address-wrapper {

            text-align: center;

            margin-top: 40px;

        }


        .add-btn {

            background: #f83f76;

            color: white;

            padding: 12px 28px;

            border-radius: 12px;

            font-weight: 600;

            border: 1.5px solid #f83f76;

            transition: all 0.2s ease;

        }


        .add-btn:hover {

            background: #fff8fb;

            color: #f83f76;

            border-color: #f83f76;

        }


        /* =========================
           EMPTY MESSAGE
           ========================= */

        .empty-message {

            background: white;

            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .08);

        }


        .empty-message h4 {

            color: #f83f76;

        }


        .empty-message p {

            color: #777;

            margin-bottom: 0;

        }


        /* =========================
           FOOTER SPACE
           ========================= */

        .footer-space {

            height: 50px;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 576px) {

            .navbar {

                padding-top: 12px;

                padding-bottom: 12px;

            }


            .navbar .container {

                padding-left: 14px;

                padding-right: 14px;

                gap: 10px;

            }


            .navbar-brand {

                font-size: 23px;

            }


            .bb-btn {

                padding: 8px 13px;

                font-size: 14px;

            }


            .page-title {

                font-size: 25px;

                margin-top: 28px;

                margin-bottom: 25px;

            }


            .address-card {

                padding: 20px;

                border-radius: 17px;

                margin-bottom: 18px;

            }


            .address-header {

                align-items: flex-start;

                gap: 10px;

            }


            .address-header h5 {

                font-size: 18px;

                line-height: 1.4;

            }


            .default {

                padding: 4px 10px;

                font-size: 12px;

            }


            .address-details {

                font-size: 15px;

                line-height: 1.6;

            }


            .address-actions {

                display: grid;

                grid-template-columns: 1fr 1fr;

                gap: 10px;

            }


            .action-btn {

                width: 100%;

                padding: 9px 10px;

                font-size: 14px;

                margin: 0;

            }


            .add-address-wrapper {

                margin-top: 30px;

            }


            .add-btn {

                width: 100%;

                max-width: 320px;

                padding: 12px 18px;

            }


            .empty-message {

                padding: 30px 20px;

            }


            .empty-message h4 {

                font-size: 20px;

            }

        }


        /* =========================
           VERY SMALL PHONES
           ========================= */

        @media (max-width: 360px) {

            .navbar-brand {

                font-size: 20px;

            }


            .bb-btn {

                font-size: 13px;

                padding: 7px 10px;

            }


            .page-title {

                font-size: 22px;

            }


            .address-card {

                padding: 17px;

            }


            .address-actions {

                grid-template-columns: 1fr;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                🌸 BlushBerry

            </a>


            <a href="profile.html" class="bb-btn">

                ← Go Back

            </a>

        </div>

    </nav>



    <!-- =========================
         PAGE
         ========================= -->

    <div class="container">


        <h2 class="page-title">

            📍 Saved Addresses

        </h2>


        <!-- ADDRESSES -->

        <div id="addressContainer"></div>


        <!-- ADD ADDRESS -->

        <div class="add-address-wrapper">

            <button class="btn add-btn" onclick="addAddress()">

                <i class="fa-solid fa-plus"></i>

                Add New Address

            </button>

        </div>


        <div class="footer-space"></div>


    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>


        // =====================================
        // LOAD SAVED ADDRESSES
        // =====================================

        let addresses =
            JSON.parse(
                localStorage.getItem("addresses")
            ) || [];



        // =====================================
        // FIRST TIME DEFAULT ADDRESS
        // =====================================

        const addressesInitialized =
            localStorage.getItem(
                "addressesInitialized"
            );


        if (
            addresses.length === 0 &&
            !addressesInitialized
        ) {

            addresses = [

                {

                    id: Date.now(),

                    name: "Lily",

                    address:
                        "123, Rose Garden Apartment",

                    city:
                        "MG Road, Akola",

                    state:
                        "Maharashtra - 411001",

                    phone:
                        "+91 9876543210",

                    default: true

                },


                {

                    id: Date.now() + 1,

                    name: "Office Address",

                    address:
                        "45, Business Tower",

                    city:
                        "Baner Road, Pune",

                    state:
                        "Maharashtra - 411045",

                    phone:
                        "+91 9876501234",

                    default: false

                }

            ];


            saveAddresses();


            localStorage.setItem(
                "addressesInitialized",
                "true"
            );

        }



        // =====================================
        // SAVE ADDRESSES
        // =====================================

        function saveAddresses() {

            localStorage.setItem(

                "addresses",

                JSON.stringify(addresses)

            );

        }



        // =====================================
        // DISPLAY ADDRESSES
        // =====================================

        function displayAddresses() {

            const container =
                document.getElementById(
                    "addressContainer"
                );


            container.innerHTML = "";


            if (addresses.length === 0) {

                container.innerHTML = `

                    <div class="empty-message">

                        <h4>
                            📍 No Saved Addresses
                        </h4>

                        <p>
                            Add an address to make checkout easier.
                        </p>

                    </div>

                `;

                return;

            }



            addresses.forEach((item, index) => {

                const card = `

                    <div class="address-card">

                        <div class="address-header">

                            <h5>
                                ${item.name}
                            </h5>

                            ${item.default
                        ? `
                                        <span class="default">
                                            Default
                                        </span>
                                      `
                        : ""
                    }

                        </div>


                        <p class="address-details">

                            ${item.address}<br>

                            ${item.city}<br>

                            ${item.state}<br>

                            Phone: ${item.phone}

                        </p>


                        <div class="address-actions">

                            <button
                                class="btn action-btn"
                                onclick="editAddress(${index})">

                                <i class="fa-solid fa-pen"></i>

                                Edit

                            </button>


                            <button
                                class="btn action-btn delete-btn"
                                onclick="deleteAddress(${index})">

                                <i class="fa-solid fa-trash"></i>

                                Delete

                            </button>

                        </div>

                    </div>

                `;


                container.innerHTML += card;

            });

        }



        // =====================================
        // ADD ADDRESS
        // =====================================

        function addAddress() {

            const name =
                prompt("Enter name:");


            if (!name) {

                return;

            }


            const address =
                prompt("Enter address:");


            if (!address) {

                return;

            }


            const city =
                prompt("Enter city:");


            if (!city) {

                return;

            }


            const state =
                prompt("Enter state and pincode:");


            if (!state) {

                return;

            }


            const phone =
                prompt("Enter phone number:");


            if (!phone) {

                return;

            }


            const newAddress = {

                id: Date.now(),

                name: name,

                address: address,

                city: city,

                state: state,

                phone: phone,

                default:
                    addresses.length === 0

            };


            addresses.push(newAddress);


            saveAddresses();


            displayAddresses();

        }



        // =====================================
        // EDIT ADDRESS
        // =====================================

        function editAddress(index) {

            const item =
                addresses[index];


            const name =
                prompt(

                    "Enter name:",

                    item.name

                );


            if (!name) {

                return;

            }


            const address =
                prompt(

                    "Enter address:",

                    item.address

                );


            if (!address) {

                return;

            }


            const city =
                prompt(

                    "Enter city:",

                    item.city

                );


            if (!city) {

                return;

            }


            const state =
                prompt(

                    "Enter state and pincode:",

                    item.state

                );


            if (!state) {

                return;

            }


            const phone =
                prompt(

                    "Enter phone number:",

                    item.phone

                );


            if (!phone) {

                return;

            }


            item.name = name;

            item.address = address;

            item.city = city;

            item.state = state;

            item.phone = phone;


            saveAddresses();


            displayAddresses();

        }



        // =====================================
        // DELETE ADDRESS
        // =====================================

        function deleteAddress(index) {

            const item =
                addresses[index];


            const confirmDelete =
                confirm(

                    "Delete " +
                    item.name +
                    " address?"

                );


            if (!confirmDelete) {

                return;

            }


            addresses.splice(index, 1);



            // Make first remaining address default

            if (addresses.length > 0) {

                addresses.forEach(
                    address => {
                        address.default = false;
                    }
                );


                addresses[0].default = true;

            }


            saveAddresses();


            displayAddresses();

        }



        // =====================================
        // DISPLAY ON PAGE LOAD
        // =====================================

        displayAddresses();

    </script>



    <!-- THEME -->

    <script src="js/theme.js"></script>


</body>

</html>
