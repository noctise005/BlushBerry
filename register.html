<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #fff, #ffe8f1);
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);

        }

        h2 {
            text-align: center;
            color: #ff4f87;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-register {
            width: 100%;
            background: #ff4f87;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
        }

        .btn-register:hover {
            background: #ff2d73;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
        }

        a {
            text-decoration: none;
            color: #ff4f87;
        }
    </style>

</head>

<body>

    <div class="register-box">

        <h2>Create Account 🌸</h2>
    
        <form id="registerForm">

            <div class="mb-3">
                <label>Full Name</label>
                <input type="text" id="registerName" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="text" id="registerPhone" class="form-control" placeholder="Enter your phone number"
                    required>
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea id="registerAddress" class="form-control" rows="3" placeholder="Enter your address"
                    required></textarea>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="registerPassword" class="form-control" placeholder="Create password"
                    required>
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password"
                    required>
            </div>

            <button type="submit" class="btn btn-register">
                Register
            </button>

        </form>


        <div class="bottom-text">

            Already have an account?
            <a href="login.html">Login</a>

        </div>

    </div>

    
    <script>

        document.getElementById("registerForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const name =
                    document.getElementById("registerName").value.trim();

                const email =
                    document.getElementById("registerEmail").value.trim();

                const phone =
                    document.getElementById("registerPhone").value.trim();

                const address =
                    document.getElementById("registerAddress").value.trim();

                const password =
                    document.getElementById("registerPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (password !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;
                }


                const user = {

                    name: name,
                    email: email,
                    phone: phone,
                    address: address,
                    password: password

                };


                localStorage.setItem(
                    "blushberryUser",
                    JSON.stringify(user)
                );


                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );


                alert(
                    "Registration successful! Welcome " +
                    name + "!"
                );


                window.location.href = "profile.html";

            });

    </script>
    <script src="js/theme.js"></script>


</body>

</html>
