<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Customers | BlushBerry</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================
           GENERAL
           ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
            color: #444;
            margin: 0;
        }


        /* =========================
           MAIN CONTAINER
           ========================= */

        .main-container {
            width: 90%;
            max-width: 1400px;
            margin: 40px auto 50px;
        }


        /* =========================
           TOP BAR
           ========================= */

        .top-bar {
            position: relative;
            min-height: 75px;
            margin-bottom: 35px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           BACK BUTTON
           ========================= */

        .back-btn {
            position: absolute;
            left: 0;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            text-decoration: none;

            background: #fffafc;
            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 10px 20px;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 500;

            transition: all 0.2s ease;

            white-space: nowrap;
        }

        .back-btn:hover {
            background: #f83f76;
            color: white;
            border-color: #f83f76;
        }

        .back-btn:active {
            background: #f83f76;
            color: white;
        }

        .back-btn:focus {
            background: #f83f76;
            color: white;
            border-color: #f83f76;
            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);
        }


        /* =========================
           PAGE TITLE
           ========================= */

        .page-title {
            color: #ff4f87;
            font-size: 42px;
            font-weight: 700;

            margin: 0;

            text-align: center;
        }


        /* =========================
           CUSTOMER BOX
           ========================= */

        .customer-box {

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);

            width: 100%;
        }


        /* =========================
           TABLE WRAPPER
           ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }


        /* =========================
           TABLE
           ========================= */

        .customer-table {

            width: 100%;

            min-width: 750px;

            margin-bottom: 0;

            border-collapse: collapse;
        }

        .customer-table th {

            background: #fff1f6;

            color: #444;

            padding: 15px;

            font-weight: 600;

            white-space: nowrap;

            text-align: center;
        }

        .customer-table td {

            padding: 15px;

            vertical-align: middle;

            text-align: center;

            white-space: nowrap;
        }

        .customer-table tbody tr {

            transition: 0.2s ease;
        }

        .customer-table tbody tr:hover {

            background: #fff8fb;
        }


        /* =========================
           VIEW BUTTON
           ========================= */

        .btn-view {

            background: #ff7aa8;

            color: white;

            border: none;

            border-radius: 20px;

            padding: 7px 18px;

            transition: 0.2s ease;
        }

        .btn-view:hover {

            background: #ff4f87;

            color: white;

            transform: translateY(-1px);
        }


        /* =========================
           CUSTOMER COUNT
           ========================= */

        .customer-count {

            color: #777;

            font-size: 14px;

            margin-bottom: 15px;
        }


        /* =========================
           TABLE SCROLLBAR
           ========================= */

        .table-wrapper::-webkit-scrollbar {
            height: 7px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #fff1f6;
            border-radius: 10px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #ff9fbd;
            border-radius: 10px;
        }


        /* =========================
           TABLET
           ========================= */

        @media (max-width: 992px) {

            .main-container {

                width: 94%;

                margin-top: 30px;
            }

            .page-title {

                font-size: 36px;
            }

            .customer-box {

                padding: 20px;
            }

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 768px) {

            .main-container {

                width: 94%;

                margin: 25px auto 40px;
            }


            /* Top bar */

            .top-bar {

                min-height: auto;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 20px;

                margin-bottom: 25px;
            }


            /* Back button */

            .back-btn {

                position: static;

                align-self: flex-start;

                padding: 8px 15px;

                font-size: 14px;
            }


            /* Title */

            .page-title {

                font-size: 30px;

                line-height: 1.2;

                text-align: center;
            }


            /* Customer box */

            .customer-box {

                padding: 15px;

                border-radius: 16px;
            }


            /* Table */

            .customer-table {

                min-width: 700px;
            }

            .customer-table th,
            .customer-table td {

                padding: 12px;

                font-size: 14px;
            }


            /* View button */

            .btn-view {

                padding: 6px 14px;

                font-size: 13px;
            }

        }


        /* =========================
           SMALL MOBILE
           ========================= */

        @media (max-width: 576px) {

            .main-container {

                width: 92%;

                margin-top: 20px;
            }


            /* Back button */

            .back-btn {

                padding: 8px 13px;

                font-size: 13px;

                border-radius: 10px;
            }


            /* Title */

            .page-title {

                font-size: 25px;

                line-height: 1.25;
            }


            /* Customer card */

            .customer-box {

                padding: 12px;

                border-radius: 15px;
            }


            /* Table */

            .customer-table {

                min-width: 680px;
            }

            .customer-table th,
            .customer-table td {

                padding: 10px;

                font-size: 13px;
            }


            /* Button */

            .btn-view {

                padding: 6px 12px;

                font-size: 12px;
            }

        }


        /* =========================
           VERY SMALL PHONES
           ========================= */

        @media (max-width: 380px) {

            .main-container {

                width: 94%;
            }

            .page-title {

                font-size: 22px;
            }

            .customer-box {

                padding: 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN CONTAINER
         ========================= -->

    <div class="main-container">


        <!-- =========================
             TOP BAR
             ========================= -->

        <div class="top-bar">


            <!-- GO BACK -->

            <a
                href="admin-dashboard.html"
                class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Go Back

            </a>


            <!-- TITLE -->

            <h2 class="page-title">

                Manage Customers

            </h2>

        </div>



        <!-- =========================
             CUSTOMER TABLE
             ========================= -->

        <div class="customer-box">


            <div class="customer-count">

                <i class="fa-solid fa-users"></i>

                Customer List

            </div>


            <!-- TABLE WRAPPER -->

            <div class="table-wrapper">

                <table class="table customer-table">


                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Orders</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="customersTableBody">

                    </tbody>


                </table>

            </div>


        </div>


    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>


        const customersTableBody =
            document.getElementById(
                "customersTableBody"
            );


        let allCustomers = [];



        // ==========================================
        // LOAD CUSTOMERS FROM ORDERS
        // ==========================================

        function loadCustomers() {


            fetch(
                "https://affectionate-spontaneity-production-044d.up.railway.app/api/orders"
            )


                .then(response => {


                    if (!response.ok) {

                        throw new Error(
                            "Failed to load customers"
                        );

                    }


                    return response.json();

                })


                .then(orders => {


                    const customerMap =
                        new Map();



                    // ==================================
                    // CREATE UNIQUE CUSTOMERS
                    // ==================================

                    orders.forEach(order => {


                        const email =
                            order.email;


                        if (!email) {

                            return;

                        }



                        if (!customerMap.has(email)) {


                            customerMap.set(

                                email,

                                {

                                    id: order.id,

                                    name:
                                        order.customerName ||
                                        "Unknown",

                                    email:
                                        order.email,

                                    mobile:
                                        order.mobileNumber ||
                                        "Not available",

                                    address:
                                        order.address ||
                                        "Not available",

                                    city:
                                        order.city ||
                                        "Not available",

                                    pincode:
                                        order.pincode ||
                                        "Not available",

                                    orders: 1

                                }

                            );


                        }


                        else {


                            customerMap
                                .get(email)
                                .orders++;

                        }

                    });



                    // ==================================
                    // CONVERT MAP TO ARRAY
                    // ==================================

                    allCustomers =
                        Array.from(
                            customerMap.values()
                        );



                    customersTableBody.innerHTML =
                        "";



                    // ==================================
                    // NO CUSTOMERS
                    // ==================================

                    if (
                        allCustomers.length === 0
                    ) {


                        customersTableBody.innerHTML = `

                            <tr>

                                <td
                                    colspan="6"
                                    class="text-center">

                                    <i class="fa-solid fa-users"></i>

                                    No customers found.

                                </td>

                            </tr>

                        `;


                        return;

                    }



                    // ==================================
                    // DISPLAY CUSTOMERS
                    // ==================================

                    allCustomers.forEach(
                        (customer, index) => {


                            const row = `

                                <tr>

                                    <td>
                                        ${index + 1}
                                    </td>


                                    <td>
                                        ${customer.name}
                                    </td>


                                    <td>
                                        ${customer.email}
                                    </td>


                                    <td>
                                        ${customer.orders}
                                    </td>


                                    <td>

                                        <span
                                            class="badge bg-success">

                                            Active

                                        </span>

                                    </td>


                                    <td>

                                        <button
                                            class="btn btn-view btn-sm"
                                            onclick="viewCustomer('${customer.email}')">

                                            <i
                                                class="fa-solid fa-eye">
                                            </i>

                                            View

                                        </button>

                                    </td>

                                </tr>

                            `;


                            customersTableBody.innerHTML +=
                                row;

                        }
                    );

                })


                .catch(error => {


                    console.error(
                        "Error loading customers:",
                        error
                    );


                    customersTableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="6"
                                class="text-center text-danger">

                                <i
                                    class="fa-solid fa-circle-exclamation">
                                </i>

                                Unable to load customers.

                                
                            </td>

                        </tr>

                    `;

                });

        }



        // ==========================================
        // VIEW CUSTOMER
        // ==========================================

        function viewCustomer(email) {


            const customer =
                allCustomers.find(
                    c => c.email === email
                );



            if (!customer) {


                alert(
                    "Customer not found."
                );


                return;

            }



            alert(

                "Customer Details\n\n" +

                "Name: " +
                customer.name +

                "\n\n" +

                "Email: " +
                customer.email +

                "\n\n" +

                "Mobile: " +
                customer.mobile +

                "\n\n" +

                "Address: " +
                customer.address +

                "\n\n" +

                "City: " +
                customer.city +

                "\n\n" +

                "Pincode: " +
                customer.pincode +

                "\n\n" +

                "Total Orders: " +
                customer.orders

            );

        }



        // ==========================================
        // LOAD CUSTOMERS WHEN PAGE OPENS
        // ==========================================

        loadCustomers();

    </script>


    <!-- THEME -->

    <script src="js/theme.js"></script>


</body>

</html>
