<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .08);
        }

         .navbar-brand {

            color: #ff4f87;

            font-size: 30px;

            font-weight: bold;

        }


        .navbar-brand:hover {

            color: #ff2d73;

        }

        .back-btn {
            border-radius: 30px;
        }

        .page-title {
            text-align: center;
            margin: 40px 0;
            color: #ff4f87;
            font-weight: bold;
        }

        .profile-edit-card {

            background: white;

            max-width: 600px;

            margin: auto;

            padding: 35px;

            border-radius: 25px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, .08);

        }

        .profile-preview {

            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            display: block;

            margin: 0 auto 25px;

            border: 4px solid #ff4f87;

        }

        .form-label {
            font-weight: bold;
        }

        .save-btn {

            background: #ff4f87;

            color: white;

            border: none;

            border-radius: 30px;

            padding: 12px 30px;

            font-weight: bold;

        }

        .save-btn:hover {

            background: #ff2d73;

            color: white;

        }

        .footer-space {
            height: 60px;
        }
    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                🌸 BlushBerry
            </a>

            <a href="profile.html"class="btn btn-outline-danger"style="border-radius:10px; padding:8px 15px;">
                ← Go Back 
            </a>
        </div>

    </nav>


    <div class="container">

        <h2 class="page-title">
            ✏️ Edit Profile
        </h2>


        <div class="profile-edit-card">


            <!-- PROFILE IMAGE -->

            <img src="images/pfp.jpg" class="profile-preview" id="profilePreview" alt="Profile Picture">


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input type="text" class="form-control" id="profileName" placeholder="Enter your name">

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email" class="form-control" id="profileEmail" placeholder="Enter your email">

            </div>


            <!-- PHONE -->

            <div class="mb-3">

                <label class="form-label">
                    Phone Number
                </label>

                <input type="text" class="form-control" id="profilePhone" placeholder="Enter your phone number">

            </div>


            <!-- PROFILE PICTURE -->

            <div class="mb-4">

                <label class="form-label">
                    Profile Picture
                </label>

                <input type="file" class="form-control" id="profileImage" accept="image/*">

            </div>


            <!-- SAVE BUTTON -->

            <div class="text-center">

                <button class="btn save-btn" onclick="saveProfile()">

                    <i class="fa-solid fa-check"></i>

                    Save Changes

                </button>

            </div>


        </div>

    </div>


    <div class="footer-space"></div>


    <script>

        // ==============================
        // LOAD SAVED PROFILE
        // ==============================

        window.onload = function () {

            const savedName =
                localStorage.getItem("profileName");

            const savedEmail =
                localStorage.getItem("profileEmail");

            const savedPhone =
                localStorage.getItem("profilePhone");

            const savedPicture =
                localStorage.getItem("profilePicture");


            if (savedName) {

                document.getElementById("profileName").value =
                    savedName;

            }


            if (savedEmail) {

                document.getElementById("profileEmail").value =
                    savedEmail;

            }


            if (savedPhone) {

                document.getElementById("profilePhone").value =
                    savedPhone;

            }


            if (savedPicture) {

                document.getElementById("profilePreview").src =
                    savedPicture;

            }

        };


        // ==============================
        // PREVIEW NEW PROFILE PICTURE
        // ==============================

        document.getElementById("profileImage")
            .addEventListener("change", function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                const reader = new FileReader();

                reader.onload = function (event) {

                    document.getElementById("profilePreview").src =
                        event.target.result;

                };

                reader.readAsDataURL(file);

            });


        // ==============================
        // SAVE PROFILE
        // ==============================

        function saveProfile() {

            const name =
                document.getElementById("profileName").value.trim();

            const email =
                document.getElementById("profileEmail").value.trim();

            const phone =
                document.getElementById("profilePhone").value.trim();


            if (name === "" || email === "" || phone === "") {

                alert("Please fill all profile details.");

                return;

            }


            // Save text information

            localStorage.setItem(
                "profileName",
                name
            );

            localStorage.setItem(
                "profileEmail",
                email
            );

            localStorage.setItem(
                "profilePhone",
                phone
            );


            // Save profile picture if a new one was selected

            const file =
                document.getElementById("profileImage").files[0];


            if (file) {

                const reader = new FileReader();

                reader.onload = function (event) {

                    localStorage.setItem(
                        "profilePicture",
                        event.target.result
                    );

                    alert("Profile updated successfully! 🌸");

                    window.location.href = "profile.html";

                };

                reader.readAsDataURL(file);

            }

            else {

                alert("Profile updated successfully! 🌸");

                window.location.href = "profile.html";

            }

        }

    </script>
    <script src="js/theme.js"></script>

</body>

</html>
