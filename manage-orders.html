<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 40px;
            margin-bottom: 50px;
        }

        /* ---------- Top Bar ---------- */

        .top-bar {
            position: relative;
            margin-bottom: 35px;
        }

        .top-bar h2 {
            text-align: center;
            color: #ff4f87;
            font-size: 42px;
            font-weight: 700;
            margin: 0;
        }

        .back-btn {

            display: inline-block;

            text-decoration: none;

            background: #fffafc;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 10px 22px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 500;

            transition: all 0.2s ease;

        }


        .back-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }


        .back-btn:active {

            background: #f83f76;

            color: white;

        }


        .back-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);

        }

        /* ---------- Table Box ---------- */

        .order-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        table {
            margin-bottom: 0;
        }

        thead {
            background: #ffe6ef;
        }

        thead th {
            color: #444;
            font-weight: 600;
        }

        .status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .delivered {
            background: #d4edda;
            color: #155724;
        }

        .processing {
            background: #fff3cd;
            color: #856404;
        }

        .shipped {
            background: #cce5ff;
            color: #004085;
        }

        /* ---------- Button ---------- */

        .btn-view {
            background: #ff7aa8;
            color: white;
        }

        .btn-view:hover {
            background: #ff5d8f;
            color: white;
        }

        /* ---------- Responsive ---------- */

        @media(max-width:768px) {

            .top-bar {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .back-btn {
                position: static;
                transform: none;
                align-self: flex-start;
            }

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="top-bar">

            <a href="admin-dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>

            <h2>Manage Orders</h2>

        </div>

        <div class="order-box">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>

                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="ordersTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script>

        const ordersTableBody = document.getElementById("ordersTableBody");

        let allOrders = [];


        // =========================
        // LOAD ALL ORDERS
        // =========================

        function loadOrders() {

            fetch("http://localhost:8080/api/orders")
                .then(response => {

                    if (!response.ok) {
                        throw new Error("Failed to load orders");
                    }

                    return response.json();

                })
                .then(orders => {

                    allOrders = orders;

                    ordersTableBody.innerHTML = "";

                    if (orders.length === 0) {

                        ordersTableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center">
                                No orders found.
                            </td>
                        </tr>
                    `;

                        return;
                    }


                    orders.forEach(order => {

                        const row = `
                        <tr>

                            <td>
                                #${order.id}
                            </td>

                            <td>
                                ${order.customerName}
                            </td>

                            <td>
                                ${order.productName || "—"}
                            </td>

                            <td>
                                ₹${order.totalAmount}
                            </td>

                            <td>

                                <select
                                    class="form-select form-select-sm"
                                    onchange="updateOrderStatus(${order.id}, this.value)"
                                    style="width: 130px;">

                                    <option value="Processing"
                                        ${order.status === "Processing" || !order.status ? "selected" : ""}>
                                        Processing
                                    </option>

                                    <option value="Shipped"
                                        ${order.status === "Shipped" ? "selected" : ""}>
                                        Shipped
                                    </option>

                                    <option value="Delivered"
                                        ${order.status === "Delivered" ? "selected" : ""}>
                                        Delivered
                                    </option>

                                </select>

                            </td>

                            <td>

                                <button
                                    class="btn btn-view btn-sm"
                                    onclick="viewOrder(${order.id})">

                                    View

                                </button>

                            </td>

                        </tr>
                    `;

                        ordersTableBody.innerHTML += row;

                    });

                })
                .catch(error => {

                    console.error("Error loading orders:", error);

                    ordersTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger">
                            Unable to load orders.
                        </td>
                    </tr>
                `;

                });

        }


        // =========================
        // UPDATE ORDER STATUS
        // =========================

        function updateOrderStatus(orderId, status) {

            console.log("Updating:", orderId, status);

            fetch(
                `http://localhost:8080/api/orders/${orderId}/status?status=${encodeURIComponent(status)}`,
                {
                    method: "PUT"
                }
            )

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Failed to update order status");
                    }

                    return response.json();

                })

                .then(updatedOrder => {

                    console.log("Updated order:", updatedOrder);

                    alert(
                        "Order status updated to " +
                        updatedOrder.status +
                        "!"
                    );

                    loadOrders();

                })

                .catch(error => {

                    console.error(
                        "Error updating order status:",
                        error
                    );

                    alert("Unable to update order status.");

                    loadOrders();

                });

        }


        // =========================
        // VIEW ORDER
        // =========================
         
        function viewOrder(id) {
            window.location.href = "order-details.html?id=" + id;
        }


        // =========================
        // START
        // =========================

        loadOrders();

    </script>
    <script src="js/theme.js"></script>

</body>

</html>
