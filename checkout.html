<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | 🌸BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #fffafc;
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: white;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }


        .navbar-brand {
            color: #ff4f87;
            font-size: 30px;
            font-weight: bold;
            text-decoration: none;
        }


        .navbar-brand:hover {
            color: #ff2d73;
        }


        /* =========================
           CHECKOUT BOX
           ========================= */

        .checkout-box,
        .summary-box {

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, .08);

        }


        /* =========================
           PLACE ORDER BUTTON
           ========================= */

        .btn-place {

            background: #ff4f87;

            color: white;

            border: none;

        }


        .btn-place:hover {

            background: #ff2d73;

            color: white;

        }


        /* =========================
           BLUSHBERRY BUTTON
           ========================= */

        .bb-btn {

            display: inline-block;

            background: #ff4f87;

            color: white;

            border: none;

            padding: 12px 28px;

            border-radius: 30px;

            font-size: 16px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow:
                0 4px 10px rgba(255, 79, 135, 0.25);

        }


        .bb-btn:hover {

            background: #ff2d73;

            color: white;

            transform: translateY(-2px);

            text-decoration: none;

        }


        /* =========================
           GO BACK BUTTON
           ========================= */

        .bb-back-btn {

            display: inline-block;

            text-decoration: none;

            background: #fffafc;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 10px 22px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 500;

            transition: all 0.2s ease;

        }


        .bb-back-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }


        .bb-back-btn:active {

            background: #f83f76;

            color: white;

        }


        .bb-back-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        /* =========================
           CHECKOUT PRODUCT
           ========================= */

        .checkout-product {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 15px;

            padding-bottom: 12px;

            border-bottom: 1px solid #eee;

        }


        .checkout-product:last-child {

            border-bottom: none;

        }


        .checkout-product-img {

            width: 65px;

            height: 65px;

            object-fit: cover;

            border-radius: 10px;

            border: 1px solid #eee;

            flex-shrink: 0;

        }


        .checkout-product-name {

            font-size: 15px;

            font-weight: 600;

            color: #444;

        }


        .checkout-product-quantity {

            font-size: 13px;

            color: #777;

        }


        .checkout-product-price {

            margin-left: auto;

            color: #ff4f87;

            font-weight: bold;

            white-space: nowrap;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 768px) {

            .navbar-brand {

                font-size: 24px;

            }

            .bb-back-btn {

                padding: 8px 15px;

                font-size: 14px;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                🌸BlushBerry

            </a>


            <a href="cart.html" class="bb-back-btn">

                ← Go Back

            </a>

        </div>

    </nav>



    <!-- =========================
         CHECKOUT
         ========================= -->

    <div class="container mt-5">

        <div class="row">


            <!-- =========================
                 SHIPPING DETAILS
                 ========================= -->

            <div class="col-lg-8">

                <div class="checkout-box">

                    <h3>
                        Shipping Details
                    </h3>

                    <hr>


                    <div class="mb-3">

                        <label for="customerName" class="form-label">

                            Full Name

                        </label>

                        <input type="text" class="form-control" id="customerName" required>

                    </div>



                    <div class="mb-3">

                        <label for="mobileNumber" class="form-label">

                            Mobile Number

                        </label>

                        <input type="tel" class="form-control" id="mobileNumber" required>

                    </div>



                    <div class="mb-3">

                        <label for="email" class="form-label">

                            Email

                        </label>

                        <input type="email" class="form-control" id="email" required>

                    </div>



                    <div class="mb-3">

                        <label for="address" class="form-label">

                            Delivery Address

                        </label>

                        <textarea class="form-control" rows="3" id="address" required></textarea>

                    </div>



                    <div class="mb-3">

                        <label for="city" class="form-label">

                            City

                        </label>

                        <input type="text" class="form-control" id="city" required>

                    </div>



                    <div class="mb-3">

                        <label for="pincode" class="form-label">

                            Pincode

                        </label>

                        <input type="text" class="form-control" id="pincode" required>

                    </div>



                    <div class="mb-3">

                        <label for="paymentMethod" class="form-label">

                            Payment Method

                        </label>


                        <select class="form-select" id="paymentMethod">

                            <option value="UPI">
                                UPI
                            </option>

                            <option value="Google Pay">
                                Google Pay
                            </option>

                            <option value="PhonePe">
                                PhonePe
                            </option>

                            <option value="Paytm">
                                Paytm
                            </option>

                            <option value="Credit/Debit Card">
                                Credit/Debit Card
                            </option>

                            <option value="Cash on Delivery">
                                Cash on Delivery
                            </option>

                        </select>

                    </div>



                    <button type="button" class="btn btn-place w-100" id="placeOrderBtn">

                        Place Order

                    </button>

                </div>

            </div>



            <!-- =========================
                 ORDER SUMMARY
                 ========================= -->

            <div class="col-lg-4">

                <div class="summary-box">

                    <h4>
                        Order Summary
                    </h4>

                    <hr>


                    <div id="checkoutItems"></div>


                    <hr>


                    <p>

                        Subtotal

                        <span class="float-end" id="checkoutSubtotal">

                            ₹0

                        </span>

                    </p>


                    <p>

                        Shipping

                        <span class="float-end text-success">

                            FREE

                        </span>

                    </p>


                    <hr>


                    <h4>

                        Total

                        <span class="float-end" id="checkoutTotal">

                            ₹0

                        </span>

                    </h4>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>


        // =====================================
        // RAILWAY BACKEND URL
        // =====================================

        const BACKEND_URL =
            "https://blushberry-backend.onrender.com";

        // =====================================
        // LOAD CART
        // =====================================

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        const checkoutItems =
            document.getElementById(
                "checkoutItems"
            );


        const checkoutSubtotal =
            document.getElementById(
                "checkoutSubtotal"
            );


        const checkoutTotal =
            document.getElementById(
                "checkoutTotal"
            );



        // =====================================
        // GET PRODUCT IMAGE URL
        // =====================================

        function getImageUrl(image) {


            // No image
            if (!image) {

                return "images/placeholder.png";

            }


            image = image.trim();



            // Already a complete URL
            if (
                image.startsWith("http://") ||
                image.startsWith("https://")
            ) {

                return image;

            }



            // uploads/filename.jpg
            if (
                image.startsWith("uploads/")
            ) {

                return BACKEND_URL +
                    "/" +
                    image;

            }



            // /uploads/filename.jpg
            if (
                image.startsWith("/uploads/")
            ) {

                return BACKEND_URL +
                    image;

            }



            // images/filename.jpg
            if (
                image.startsWith("images/")
            ) {

                return image;

            }



            // /images/filename.jpg
            if (
                image.startsWith("/images/")
            ) {

                return image;

            }



            // Just filename
            return "images/" + image;

        }



        // =====================================
        // DISPLAY CHECKOUT
        // =====================================

        function displayCheckout() {


            checkoutItems.innerHTML = "";



            // =================================
            // EMPTY CART
            // =================================

            if (cart.length === 0) {


                checkoutItems.innerHTML = `

                    <div class="text-center">

                        <p>
                            Your cart is empty.
                        </p>

                        <a
                            href="products.html"
                            class="bb-btn">

                            Continue Shopping

                        </a>

                    </div>

                `;


                checkoutSubtotal.textContent =
                    "₹0";


                checkoutTotal.textContent =
                    "₹0";


                return;

            }



            let subtotal = 0;



            // =================================
            // DISPLAY PRODUCTS
            // =================================

            cart.forEach(product => {


                const quantity =
                    product.quantity || 1;


                const price =
                    Number(product.price) || 0;


                const itemTotal =
                    price * quantity;


                subtotal +=
                    itemTotal;



                const imageUrl =
                    getImageUrl(
                        product.image
                    );



                checkoutItems.innerHTML += `

                    <div class="checkout-product">


                        <img

                            src="${imageUrl}"

                            class="checkout-product-img"

                            alt="${product.name}"

                            onerror="
                                this.onerror=null;
                                this.src='images/placeholder.png';
                            "

                        >


                        <div>

                            <div class="checkout-product-name">

                                ${product.name}

                            </div>


                            <div class="checkout-product-quantity">

                                Quantity: ${quantity}

                            </div>

                        </div>


                        <div class="checkout-product-price">

                            ₹${itemTotal}

                        </div>


                    </div>

                `;

            });



            // =================================
            // UPDATE TOTALS
            // =================================

            checkoutSubtotal.textContent =
                "₹" + subtotal;


            checkoutTotal.textContent =
                "₹" + subtotal;

        }



        // =====================================
        // DISPLAY CHECKOUT ON LOAD
        // =====================================

        displayCheckout();



        // =====================================
        // PLACE ORDER
        // =====================================

        const placeOrderBtn =
            document.getElementById(
                "placeOrderBtn"
            );


        placeOrderBtn.addEventListener(
            "click",
            async function () {


                // =================================
                // CHECK CART
                // =================================

                if (cart.length === 0) {

                    alert(
                        "Your cart is empty."
                    );

                    return;

                }



                // =================================
                // GET FORM VALUES
                // =================================

                const customerName =
                    document
                        .getElementById(
                            "customerName"
                        )
                        .value
                        .trim();


                const mobileNumber =
                    document
                        .getElementById(
                            "mobileNumber"
                        )
                        .value
                        .trim();


                const email =
                    document
                        .getElementById(
                            "email"
                        )
                        .value
                        .trim();


                const address =
                    document
                        .getElementById(
                            "address"
                        )
                        .value
                        .trim();


                const city =
                    document
                        .getElementById(
                            "city"
                        )
                        .value
                        .trim();


                const pincode =
                    document
                        .getElementById(
                            "pincode"
                        )
                        .value
                        .trim();


                const paymentMethod =
                    document
                        .getElementById(
                            "paymentMethod"
                        )
                        .value;



                // =================================
                // VALIDATION
                // =================================

                if (
                    !customerName ||
                    !mobileNumber ||
                    !email ||
                    !address ||
                    !city ||
                    !pincode
                ) {

                    alert(
                        "Please fill all shipping details."
                    );

                    return;

                }



                // =================================
                // CALCULATE TOTAL
                // =================================

                const totalAmount =
                    cart.reduce(
                        (
                            total,
                            product
                        ) => {

                            return total +
                                (
                                    Number(
                                        product.price
                                    ) *
                                    (
                                        product.quantity ||
                                        1
                                    )
                                );

                        },
                        0
                    );



                // =================================
                // CREATE ORDER
                // =================================

                const order = {

                    customerName:
                        customerName,

                    mobileNumber:
                        mobileNumber,

                    email:
                        email,

                    address:
                        address,

                    city:
                        city,

                    pincode:
                        pincode,

                    paymentMethod:
                        paymentMethod,

                    productName:
                        cart.length > 0
                            ? cart[0].name
                            : "",

                    productImage:
                        cart.length > 0
                            ? cart[0].image
                            : "",

                    totalAmount:
                        totalAmount

                };



                // =================================
                // DISABLE BUTTON
                // =================================

                placeOrderBtn.disabled =
                    true;


                placeOrderBtn.textContent =
                    "Placing Order...";



                // =================================
                // SEND ORDER TO RAILWAY
                // =================================

                try {


                    const response =
                        await fetch(

                            BACKEND_URL +
                            "/api/orders",

                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(
                                        order
                                    )

                            }

                        );



                    if (!response.ok) {

                        throw new Error(
                            "Failed to place order"
                        );

                    }



                    const data =
                        await response.json();



                    // =================================
                    // SUCCESS
                    // =================================

                    alert(
                        "Order placed successfully! 🎉"
                    );


                    // Remove cart
                    localStorage.removeItem(
                        "cart"
                    );


                    // Go to order details
                    window.location.href =
                        "order-details.html?id=" +
                        data.id;


                }

                catch (error) {


                    console.error(
                        "Order error:",
                        error
                    );


                    alert(
                        "Unable to place order. Please try again."
                    );


                    placeOrderBtn.disabled =
                        false;


                    placeOrderBtn.textContent =
                        "Place Order";

                }

            }

        );


    </script>


    <script src="js/theme.js"></script>

</body>

</html>
