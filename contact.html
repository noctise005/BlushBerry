<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #fffafc;
            font-family: Arial, sans-serif;
        }

        .contact-box {
            position: relative;
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        h2 {
            color: #ff4f87;
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-send {
            background: #ff4f87;
            color: white;
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
        }

        .btn-send:hover {
            background: #ff2d73;
            color: white;
        }

        .message-box {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .success-message {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error-message {
            background: #f8d7da;
            color: #842029;
        }

        /* =========================
           BACK TO HOME BUTTON
           ========================= */

        .btn-home {
            display: none;
            margin-top: 15px;
            width: 100%;
            background: #fffafc;
            color: #ff4f87;
            border: 1.5px solid #ff4f87;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background: #ff4f87;
            color: white;
        }
    </style>

</head>


<body>


    <div class="contact-box">

        <h2>
            Contact Us 💌
        </h2>


        <form id="contactForm">


            <input type="text" class="form-control mb-3" id="name" placeholder="Your Name" required>


            <input type="email" class="form-control mb-3" id="email" placeholder="Email Address" required>


            <textarea class="form-control mb-3" id="message" rows="5" placeholder="Write your message..."
                required></textarea>


            <button type="submit" class="btn btn-send" id="sendButton">

                Send Message

            </button>


        </form>


        <div id="successMessage" class="message-box success-message">

            Message sent successfully! 💌

        </div>


        <div id="errorMessage" class="message-box error-message">

            Unable to send message. Please try again.

        </div>


        <!-- BACK TO HOME BUTTON -->

        <a href="index.html" id="homeButton" class="btn-home">

            ← Back to Home

        </a>


    </div>



    <script>

        const contactForm =
            document.getElementById("contactForm");

        const sendButton =
            document.getElementById("sendButton");

        const successMessage =
            document.getElementById("successMessage");

        const errorMessage =
            document.getElementById("errorMessage");

        const homeButton =
            document.getElementById("homeButton");


        contactForm.addEventListener(

            "submit",

            function (event) {

                event.preventDefault();


                // Hide previous messages

                successMessage.style.display = "none";

                errorMessage.style.display = "none";

                homeButton.style.display = "none";


                // Get values

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const message =
                    document.getElementById("message").value.trim();


                // Extra validation

                if (!name || !email || !message) {

                    errorMessage.textContent =
                        "Please fill all the fields.";

                    errorMessage.style.display =
                        "block";

                    return;

                }


                // Disable button while sending

                sendButton.disabled = true;

                sendButton.textContent =
                    "Sending...";


                // Send data to Spring Boot

                fetch(
                    "https://affectionate-spontaneity-production-044d.up.railway.app/api/contact",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            message: message

                        })

                    }

                )


                    .then(response => {

                        if (!response.ok) {

                            throw new Error(
                                "Failed to send message"
                            );

                        }

                        return response.json();

                    })


                    .then(data => {

                        console.log(
                            "Message saved:",
                            data
                        );


                        successMessage.style.display =
                            "block";


                        // Show Back to Home button

                        homeButton.style.display =
                            "block";


                        contactForm.reset();

                    })


                    .catch(error => {

                        console.error(
                            "Contact error:",
                            error
                        );


                        errorMessage.style.display =
                            "block";

                    })


                    .finally(() => {

                        sendButton.disabled = false;

                        sendButton.textContent =
                            "Send Message";

                    });

            }

        );

    </script>


    <script src="js/theme.js"></script>


</body>

</html>
