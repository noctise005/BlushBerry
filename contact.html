<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | BlushBerry</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* =========================
           GLOBAL
           ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fffafc;
            font-family: Arial, sans-serif;
            color: #444;
        }


        /* =========================
           CONTACT CONTAINER
           ========================= */

        .contact-box {

            width: 90%;
            max-width: 600px;

            margin: 60px auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, .08);

        }


        /* =========================
           TITLE
           ========================= */

        h2 {

            color: #ff4f87;

            text-align: center;

            margin-bottom: 25px;

            font-weight: bold;

        }


        /* =========================
           FORM LABELS
           ========================= */

        label {

            font-weight: 600;

            margin-bottom: 6px;

        }


        /* =========================
           INPUTS
           ========================= */

        .form-control {

            border-radius: 10px;

            padding: 11px;

        }

        .form-control:focus {

            border-color: #ff4f87;

            box-shadow:
                0 0 0 3px rgba(255, 79, 135, 0.15);

        }


        /* =========================
           SEND BUTTON
           ========================= */

        .btn-send {

            background: #ff4f87;

            color: white;

            width: 100%;

            border: none;

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

            transition: all 0.2s ease;

        }

        .btn-send:hover {

            background: #ff2d73;

            color: white;

            transform: translateY(-1px);

        }

        .btn-send:active {

            background: #ff2d73 !important;

            color: white !important;

        }

        .btn-send:focus {

            background: #ff4f87;

            color: white;

            box-shadow:
                0 0 0 3px rgba(255, 79, 135, 0.20);

        }


        /* =========================
           MESSAGE BOX
           ========================= */

        .message-box {

            display: none;

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-weight: 500;

        }


        .success-message {

            background: #d1e7dd;

            color: #0f5132;

        }


        .error-message {

            background: #f8d7da;

            color: #842029;

        }


        /* =========================
           BACK TO HOME BUTTON
           ========================= */

        .btn-home {

            display: none;

            margin-top: 15px;

            width: 100%;

            background: #fffafc;

            color: #ff4f87;

            border: 1.5px solid #ff4f87;

            padding: 10px;

            border-radius: 10px;

            text-decoration: none;

            text-align: center;

            transition: all 0.2s ease;

        }


        .btn-home:hover {

            background: #ff4f87;

            color: white;

            text-decoration: none;

        }


        /* =========================
           TABLET
           ========================= */

        @media (max-width: 768px) {

            .contact-box {

                width: 90%;

                margin: 40px auto;

                padding: 30px;

                border-radius: 18px;

            }

            h2 {

                font-size: 26px;

            }

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 576px) {

            body {

                padding: 0;

            }


            .contact-box {

                width: calc(100% - 30px);

                margin: 25px auto;

                padding: 22px 18px;

                border-radius: 16px;

            }


            h2 {

                font-size: 23px;

                margin-bottom: 20px;

            }


            .form-control {

                font-size: 15px;

                padding: 10px;

            }


            textarea.form-control {

                min-height: 120px;

            }


            .btn-send {

                padding: 11px;

                font-size: 16px;

            }


            .message-box {

                font-size: 14px;

                padding: 10px;

            }


            .btn-home {

                font-size: 15px;

                padding: 10px;

            }

        }


        /* =========================
           VERY SMALL PHONES
           ========================= */

        @media (max-width: 360px) {

            .contact-box {

                width: calc(100% - 20px);

                padding: 18px 14px;

            }


            h2 {

                font-size: 21px;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         CONTACT BOX
         ========================= -->

    <div class="contact-box">

        <h2>
            Contact Us 💌
        </h2>


        <form id="contactForm">


            <!-- NAME -->

            <div class="mb-3">

                <label for="name">
                    Your Name
                </label>

                <input type="text" class="form-control" id="name" placeholder="Your Name" required>

            </div>


            <!-- EMAIL -->

            <div class="mb-3">

                <label for="email">
                    Email Address
                </label>

                <input type="email" class="form-control" id="email" placeholder="Email Address" required>

            </div>


            <!-- MESSAGE -->

            <div class="mb-3">

                <label for="message">
                    Message
                </label>

                <textarea class="form-control" id="message" rows="5" placeholder="Write your message..."
                    required></textarea>

            </div>


            <!-- SEND -->

            <button type="submit" class="btn btn-send" id="sendButton">

                Send Message

            </button>


        </form>


        <!-- =========================
             SUCCESS MESSAGE
             ========================= -->

        <div id="successMessage" class="message-box success-message">

            Message sent successfully! 💌

        </div>


        <!-- =========================
             ERROR MESSAGE
             ========================= -->

        <div id="errorMessage" class="message-box error-message">

            Unable to send message. Please try again.

        </div>


        <!-- =========================
             BACK HOME
             ========================= -->

        <a href="index.html" id="homeButton" class="btn-home">

            ← Back to Home

        </a>


    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        const contactForm =
            document.getElementById("contactForm");

        const sendButton =
            document.getElementById("sendButton");

        const successMessage =
            document.getElementById("successMessage");

        const errorMessage =
            document.getElementById("errorMessage");

        const homeButton =
            document.getElementById("homeButton");


        /* =========================
           SUBMIT CONTACT FORM
           ========================= */

        contactForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                /* =========================
                   HIDE OLD MESSAGES
                   ========================= */

                successMessage.style.display = "none";

                errorMessage.style.display = "none";

                homeButton.style.display = "none";


                /* =========================
                   GET VALUES
                   ========================= */

                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const message =
                    document
                        .getElementById("message")
                        .value
                        .trim();


                /* =========================
                   VALIDATION
                   ========================= */

                if (!name || !email || !message) {

                    errorMessage.textContent =
                        "Please fill all the fields.";

                    errorMessage.style.display =
                        "block";

                    return;

                }


                /* =========================
                   DISABLE BUTTON
                   ========================= */

                sendButton.disabled = true;

                sendButton.textContent =
                    "Sending...";


                /* =========================
                   SEND TO SPRING BOOT
                   ========================= */

                fetch(
                    "https://affectionate-spontaneity-production-044d.up.railway.app/api/contact",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            message: message

                        })

                    }
                )


                    /* =========================
                       RESPONSE
                       ========================= */

                    .then(response => {

                        if (!response.ok) {

                            throw new Error(
                                "Failed to send message"
                            );

                        }

                        return response.json();

                    })


                    /* =========================
                       SUCCESS
                       ========================= */

                    .then(data => {

                        console.log(
                            "Message saved:",
                            data
                        );


                        successMessage.style.display =
                            "block";


                        homeButton.style.display =
                            "block";


                        contactForm.reset();

                    })


                    /* =========================
                       ERROR
                       ========================= */

                    .catch(error => {

                        console.error(
                            "Contact error:",
                            error
                        );


                        errorMessage.style.display =
                            "block";

                    })


                    /* =========================
                       FINALLY
                       ========================= */

                    .finally(() => {

                        sendButton.disabled = false;

                        sendButton.textContent =
                            "Send Message";

                    });

            }
        );

    </script>


    <!-- THEME -->

    <script src="js/theme.js"></script>


</body>

</html>
