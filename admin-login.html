<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | 🌸BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #fffafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);
        }

        h2 {
            text-align: center;
            color: #ff4f87;
            margin-bottom: 25px;
        }

        .login-btn {
            background: #ff6b9a;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #ff4f87;
            color: white;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h2>Admin Login</h2>

        <form action="admin-dashboard.html">

            <div class="mb-3">
                <label>Admin Email</label>
                <input type="email" class="form-control">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control">
            </div>

            <button type="button" class="btn login-btn w-100" onclick="window.location.href='admin-dashboard.html'">
                Login
            </button>
        </form>

    </div>
    
    <script src="js/theme.js"></script>

</body>

</html>
