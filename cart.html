<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #fffafc;
            font-family: Arial, sans-serif;
        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: white;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }


        .navbar-brand {

            color: #ff4f87;

            font-size: 30px;

            font-weight: bold;

        }


        .navbar-brand:hover {

            color: #ff2d73;

        }


        /* =========================
           CART BOX
           ========================= */

        .cart-box {

            background: white;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, .08);

        }


        /* =========================
           PRODUCT IMAGE
           ========================= */

        .product-img {

            width: 90px;

            height: 90px;

            object-fit: cover;

            border-radius: 10px;

            border: 1px solid #eee;

        }


        /* =========================
           PRICE
           ========================= */

        .price {

            color: #ff4f87;

            font-weight: bold;

        }


        /* =========================
           TOTAL BOX
           ========================= */

        .total-box {

            background: white;

            padding: 20px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, .08);

        }


        /* =========================
           CHECKOUT BUTTON
           ========================= */

        .btn-checkout {

            background: #ff4f87;

            color: white;

            border: none;

        }


        .btn-checkout:hover {

            background: #ff2d73;

            color: white;

        }


        /* =========================
           BLUSHBERRY BUTTON
           ========================= */

        .bb-btn {

            display: inline-block;

            background: #ff4f87;

            color: white;

            border: none;

            padding: 12px 28px;

            border-radius: 30px;

            font-size: 16px;

            font-weight: 600;

            text-decoration: none;

            cursor: pointer;

            transition: 0.3s ease;

            box-shadow:
                0 4px 10px rgba(255, 79, 135, 0.25);

        }


        .bb-btn:hover {

            background: #ff2d73;

            color: white;

            transform: translateY(-2px);

            text-decoration: none;

        }


        /* =========================
           GO BACK BUTTON
           ========================= */

        .bb-back-btn {

            margin-top: 25px;

            margin-left: 20px;

        }


        /* =========================
           LARGER GO BACK BUTTON
           ========================= */

        .bb-back-large {

            padding: 14px 32px;

            font-size: 18px;

        }


        /* =========================
           EMPTY CART
           ========================= */

        .empty-cart {

            padding: 40px;

            text-align: center;

            color: #777;

        }


        .empty-cart h4 {

            color: #ff4f87;

            margin-bottom: 15px;

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 768px) {

            .navbar-brand {

                font-size: 24px;

            }

            .bb-btn {

                padding: 9px 16px;

                font-size: 14px;

            }

            .cart-box {

                overflow-x: auto;

            }

            table {

                min-width: 700px;

            }

        }
    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <a class="navbar-brand" href="index.html">

                🌸BlushBerry

            </a>


            <a href="products.html" class="bb-btn">

                Continue Shopping

            </a>

        </div>

    </nav>



    <!-- =========================
         CART
         ========================= -->

    <div class="container mt-5">

        <h2 class="mb-4">

            🛒 Shopping Cart

        </h2>


        <div class="row">


            <!-- =========================
                 CART PRODUCTS
                 ========================= -->

            <div class="col-lg-8">

                <div class="cart-box">

                    <table class="table align-middle">

                        <thead>

                            <tr>

                                <th>Product</th>

                                <th>Name</th>

                                <th>Price</th>

                                <th>Qty</th>

                                <th>Total</th>

                                <th></th>

                            </tr>

                        </thead>


                        <tbody id="cartItems">

                        </tbody>

                    </table>

                </div>

            </div>



            <!-- =========================
                 ORDER SUMMARY
                 ========================= -->

            <div class="col-lg-4">

                <div class="total-box">

                    <h4>

                        Order Summary

                    </h4>


                    <hr>


                    <p>

                        Subtotal

                        <span class="float-end" id="subtotal">

                            ₹0

                        </span>

                    </p>


                    <p>

                        Shipping

                        <span class="float-end">

                            Free

                        </span>

                    </p>


                    <h5>

                        Total

                        <span class="float-end" id="total">

                            ₹0

                        </span>

                    </h5>


                    <hr>


                    <a href="checkout.html" class="btn btn-checkout w-100">

                        Proceed to Checkout

                    </a>

                </div>

            </div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>


        // =====================================
        // RAILWAY BACKEND URL
        // =====================================

        const BACKEND_URL =
            "https://blushberry-backend.onrender.com";


        // =====================================
        // LOAD CART
        // =====================================

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        const cartItems =
            document.getElementById(
                "cartItems"
            );


        const subtotalElement =
            document.getElementById(
                "subtotal"
            );


        const totalElement =
            document.getElementById(
                "total"
            );



        // =====================================
        // GET PRODUCT IMAGE URL
        // =====================================

        function getImageUrl(image) {


            // No image
            if (!image) {

                return "images/placeholder.png";

            }


            image = image.trim();



            // ---------------------------------
            // IMAGE IS ALREADY A FULL URL
            // ---------------------------------

            if (
                image.startsWith("http://") ||
                image.startsWith("https://")
            ) {

                return image;

            }



            // ---------------------------------
            // RAILWAY UPLOADS
            // ---------------------------------

            if (
                image.startsWith("uploads/")
            ) {

                return BACKEND_URL +
                    "/" +
                    image;

            }



            // ---------------------------------
            // /uploads/
            // ---------------------------------

            if (
                image.startsWith("/uploads/")
            ) {

                return BACKEND_URL +
                    image;

            }



            // ---------------------------------
            // FRONTEND IMAGES
            // ---------------------------------

            if (
                image.startsWith("images/")
            ) {

                return image;

            }



            // ---------------------------------
            // /images/
            // ---------------------------------

            if (
                image.startsWith("/images/")
            ) {

                return image;

            }



            // ---------------------------------
            // NORMAL FILE NAME
            // Example:
            // serum.jpg
            // cream2.jpg
            // toner4.jpg
            // ---------------------------------

            return "images/" + image;

        }



        // =====================================
        // DISPLAY CART
        // =====================================

        function displayCart() {


            cartItems.innerHTML = "";



            // =================================
            // EMPTY CART
            // =================================

            if (cart.length === 0) {


                cartItems.innerHTML = `

                    <tr>

                        <td
                            colspan="6"
                            class="empty-cart">

                            <h4>
                                🛒 Your Cart is Empty
                            </h4>

                            <p>
                                Add some beautiful
                                K-Beauty products
                                to your cart.
                            </p>

                            <a
                                href="products.html"
                                class="bb-btn">

                                Start Shopping

                            </a>

                        </td>

                    </tr>

                `;


                subtotalElement.textContent =
                    "₹0";


                totalElement.textContent =
                    "₹0";


                return;

            }



            // =================================
            // CALCULATE SUBTOTAL
            // =================================

            let subtotal = 0;



            // =================================
            // DISPLAY PRODUCTS
            // =================================

            cart.forEach(
                (product, index) => {


                    const quantity =
                        product.quantity || 1;


                    const price =
                        Number(product.price) || 0;


                    const itemTotal =
                        price * quantity;


                    subtotal +=
                        itemTotal;



                    // =========================
                    // IMAGE URL
                    // =========================

                    const imageUrl =
                        getImageUrl(
                            product.image
                        );



                    // =========================
                    // PRODUCT ROW
                    // =========================

                    const row = `

                        <tr>


                            <!-- PRODUCT IMAGE -->

                            <td>

                                <img

                                    src="${imageUrl}"

                                    class="product-img"

                                    alt="${product.name}"

                                    onerror="
                                        this.onerror=null;
                                        this.src='images/placeholder.png';
                                    "

                                >

                            </td>



                            <!-- PRODUCT NAME -->

                            <td>

                                ${product.name}

                            </td>



                            <!-- PRICE -->

                            <td class="price">

                                ₹${price}

                            </td>



                            <!-- QUANTITY -->

                            <td>

                                <input

                                    type="number"

                                    value="${quantity}"

                                    min="1"

                                    class="form-control"

                                    style="width:80px;"

                                    oninput="
                                        updateQuantity(
                                            ${index},
                                            this.value
                                        )
                                    "

                                >

                            </td>



                            <!-- ITEM TOTAL -->

                            <td class="price">

                                ₹${itemTotal}

                            </td>



                            <!-- REMOVE -->

                            <td>

                                <button

                                    class="btn btn-danger btn-sm"

                                    onclick="
                                        removeFromCart(
                                            ${index}
                                        )
                                    "

                                >

                                    Remove

                                </button>

                            </td>


                        </tr>

                    `;



                    cartItems.innerHTML +=
                        row;

                }

            );



            // =================================
            // UPDATE TOTALS
            // =================================

            subtotalElement.textContent =
                "₹" + subtotal;


            totalElement.textContent =
                "₹" + subtotal;

        }



        // =====================================
        // REMOVE PRODUCT
        // =====================================

        function removeFromCart(index) {


            cart.splice(
                index,
                1
            );


            localStorage.setItem(

                "cart",

                JSON.stringify(cart)

            );


            displayCart();

        }



        // =====================================
        // UPDATE QUANTITY
        // =====================================

        function updateQuantity(
            index,
            quantity
        ) {


            quantity =
                parseInt(quantity);



            if (
                quantity < 1 ||
                isNaN(quantity)
            ) {

                quantity = 1;

            }



            cart[index].quantity =
                quantity;



            localStorage.setItem(

                "cart",

                JSON.stringify(cart)

            );


            displayCart();

        }



        // =====================================
        // DISPLAY CART ON PAGE LOAD
        // =====================================

        displayCart();


    </script>



    <!-- THEME SCRIPT -->

    <script src="js/theme.js"></script>


</body>

</html>
