<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
        }

        .container {
            margin-top: 40px;
            margin-bottom: 50px;
        }

        .top-bar {
            position: relative;
            margin-bottom: 35px;
        }

        .back-btn {

            display: inline-block;

            text-decoration: none;

            background: #fffafc;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 10px 22px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 500;

            transition: all 0.2s ease;

        }


        .back-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }


        .back-btn:active {

            background: #f83f76;

            color: white;

        }


        .back-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        .top-bar h2 {
            text-align: center;
            color: #ff4f87;
            font-size: 42px;
            font-weight: 700;
            margin: 0;
        }

        .product-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);
        }

        .btn-edit {
            background: #ff7aa8;
            color: white;
        }

        .btn-edit:hover {
            background: #ff5d8f;
            color: white;
        }

        .btn-delete {
            background: #ffb3c9;
            color: #444;
        }

        .btn-delete:hover {
            background: #ff94b6;
            color: #222;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="top-bar">

            <a href="admin-dashboard.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>

            <h2>Manage Products</h2>

        </div>

        <div class="product-box">

            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Product</th>
                        <th>Brand</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="productsTableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script>

        const productsTableBody =
            document.getElementById("productsTableBody");


        // =========================
        // LOAD PRODUCTS
        // =========================

        function loadProducts() {

            fetch("http://localhost:8080/api/products")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Failed to load products");
                    }

                    return response.json();

                })

                .then(products => {

                    productsTableBody.innerHTML = "";

                    if (products.length === 0) {

                        productsTableBody.innerHTML = `
                        <tr>
                            <td colspan="7"
                                class="text-center">
                                No products found.
                            </td>
                        </tr>
                    `;

                        return;
                    }


                    products.forEach(product => {

                        const row = `
                        <tr>

                            <td>
                                ${product.id}
                            </td>

                            <td>

                                <img
                                src="${product.image.startsWith('uploads/')
                                ? 'http://localhost:8080/' + product.image
                                : 'images/' + product.image}"
                                alt="${product.name}" style=" 
                                width:60px;
                                height:60px;
                                object-fit:cover;
                                border-radius:10px;">

                            </td>

                            <td>
                                ${product.name}
                            </td>

                            <td>
                                ${product.brand}
                            </td>

                            <td>
                                ${product.category}
                            </td>

                            <td>
                                ₹${product.price}
                            </td>

                            <td>

                                <button
                                    class="btn btn-edit btn-sm"
                                    onclick="editProduct(${product.id})">

                                    Edit

                                </button>

                                <button
                                    class="btn btn-delete btn-sm"
                                    onclick="deleteProduct(${product.id})">

                                    Delete

                                </button>

                            </td>

                        </tr>
                    `;

                        productsTableBody.innerHTML += row;

                    });

                })

                .catch(error => {

                    console.error(
                        "Error loading products:",
                        error
                    );

                    productsTableBody.innerHTML = `
                    <tr>
                        <td colspan="7"
                            class="text-center text-danger">

                            Unable to load products.

                        </td>
                    </tr>
                `;

                });

        }


        // =========================
        // DELETE PRODUCT
        // =========================

        function deleteProduct(id) {

            const confirmDelete =
                confirm("Are you sure you want to delete this product?");

            if (!confirmDelete) {
                return;
            }


            fetch(`http://localhost:8080/api/products/${id}`, {

                method: "DELETE"

            })

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Failed to delete product");
                    }

                    return response.text();

                })

                .then(message => {

                    alert("Product deleted successfully!");

                    loadProducts();

                })

                .catch(error => {

                    console.error(
                        "Error deleting product:",
                        error
                    );

                    alert("Unable to delete product.");

                });

        }


        // =========================
        // EDIT PRODUCT
        // =========================

        function editProduct(id) {

            fetch(`http://localhost:8080/api/products/${id}`)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Failed to get product");
                    }

                    return response.json();

                })

                .then(product => {

                    const name =
                        prompt("Product Name:", product.name);

                    if (name === null) return;


                    const brand =
                        prompt("Brand:", product.brand);

                    if (brand === null) return;


                    const price =
                        prompt("Price:", product.price);

                    if (price === null) return;


                    const category =
                        prompt("Category:", product.category);

                    if (category === null) return;


                    const image =
                        prompt("Image filename:", product.image);

                    if (image === null) return;


                    const updatedProduct = {

                        name: name,
                        brand: brand,
                        price: parseFloat(price),
                        category: category,
                        image: image

                    };


                    fetch(
                        `http://localhost:8080/api/products/${id}`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(updatedProduct)

                        }
                    )

                        .then(response => {

                            if (!response.ok) {
                                throw new Error(
                                    "Failed to update product"
                                );
                            }

                            return response.json();

                        })

                        .then(updatedProduct => {

                            alert(
                                "Product updated successfully!"
                            );

                            loadProducts();

                        })

                        .catch(error => {

                            console.error(
                                "Error updating product:",
                                error
                            );

                            alert(
                                "Unable to update product."
                            );

                        });

                })

                .catch(error => {

                    console.error(
                        "Error getting product:",
                        error
                    );

                    alert(
                        "Unable to load product."
                    );

                });

        }


        // =========================
        // START
        // =========================

        loadProducts();

    </script>
    <script src="js/theme.js"></script>

</body>

</html>
