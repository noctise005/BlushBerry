<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Products | BlushBerry</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =========================================
           BODY
           ========================================= */

        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }


        /* =========================================
           MAIN CONTAINER
           ========================================= */

        .main-container {
            width: 100%;
            max-width: 1400px;
            margin: 40px auto 50px;
            padding: 0 20px;
        }


        /* =========================================
           TOP BAR
           ========================================= */

        .top-bar {
            position: relative;
            min-height: 70px;
            margin-bottom: 35px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================================
           PAGE TITLE
           ========================================= */

        .page-title {
            color: #ff4f87;
            font-size: 42px;
            font-weight: 700;
            margin: 0;
            text-align: center;
        }


        /* =========================================
           GO BACK BUTTON
           ========================================= */

        .back-btn {
            position: absolute;
            left: 0;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            text-decoration: none;

            background: #fffafc;
            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 10px 22px;
            border-radius: 12px;

            font-size: 16px;
            font-weight: 500;

            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #f83f76;
            color: white;
            border-color: #f83f76;
            text-decoration: none;
        }

        .back-btn:active {
            background: #f83f76;
            color: white;
        }

        .back-btn:focus {
            background: #f83f76;
            color: white;
            border-color: #f83f76;
            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);
        }


        /* =========================================
           PRODUCT BOX
           ========================================= */

        .product-box {
            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);
        }


        /* =========================================
           TABLE
           ========================================= */

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            margin-bottom: 0 !important;
            min-width: 950px;
        }

        thead {
            background: #ffe6ef;
        }

        thead th {
            color: #444;
            font-weight: 600;
            white-space: nowrap;
            padding: 15px;
        }

        tbody td {
            vertical-align: middle;
            padding: 14px 15px;
        }


        /* =========================================
           PRODUCT IMAGE
           ========================================= */

        .product-image {
            width: 60px;
            height: 60px;

            object-fit: cover;

            border-radius: 10px;

            border: 1px solid #f3d9e2;
        }


        /* =========================================
           EDIT BUTTON
           ========================================= */

        .btn-edit {
            background: #ff7aa8;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
        }

        .btn-edit:hover {
            background: #ff5d8f;
            color: white;
        }


        /* =========================================
           DELETE BUTTON
           ========================================= */

        .btn-delete {
            background: #ffb3c9;
            color: #444;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
        }

        .btn-delete:hover {
            background: #ff94b6;
            color: #222;
        }


        /* =========================================
           MOBILE SCROLL HINT
           ========================================= */

        .scroll-hint {
            display: none;

            color: #888;
            font-size: 13px;

            text-align: center;

            margin-bottom: 10px;
        }


        /* =========================================
           TABLET
           ========================================= */

        @media (max-width: 992px) {

            .main-container {
                margin-top: 30px;
                padding: 0 18px;
            }

            .page-title {
                font-size: 36px;
            }

            .product-box {
                padding: 20px;
            }
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 768px) {

            .main-container {
                margin-top: 20px;
                margin-bottom: 30px;
                padding: 0 12px;
            }

            .top-bar {
                min-height: auto;

                display: flex;
                flex-direction: column;

                align-items: center;

                gap: 15px;

                margin-bottom: 25px;
            }

            .back-btn {
                position: static;

                align-self: flex-start;

                padding: 9px 17px;

                font-size: 14px;

                border-radius: 10px;
            }

            .page-title {
                font-size: 30px;
                line-height: 1.2;

                width: 100%;
            }

            .product-box {
                padding: 12px;
                border-radius: 15px;
            }

            .scroll-hint {
                display: block;
            }

            table {
                min-width: 950px;
            }

            thead th {
                font-size: 14px;
                padding: 12px;
            }

            tbody td {
                font-size: 14px;
                padding: 12px;
            }

            .product-image {
                width: 55px;
                height: 55px;
            }

            .btn-edit,
            .btn-delete {
                font-size: 13px;
                padding: 6px 12px;
            }
        }


        /* =========================================
           SMALL MOBILE
           ========================================= */

        @media (max-width: 480px) {

            .main-container {
                padding: 0 10px;
            }

            .page-title {
                font-size: 26px;
            }

            .back-btn {
                font-size: 13px;
                padding: 8px 14px;
            }

            .product-box {
                padding: 10px;
                border-radius: 14px;
            }

            .scroll-hint {
                font-size: 12px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         MAIN CONTAINER
         ========================================= -->

    <div class="main-container">


        <!-- =========================================
             TOP BAR
             ========================================= -->

        <div class="top-bar">

            <!-- GO BACK -->

            <a
                href="admin-dashboard.html"
                class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                <span>Go Back</span>

            </a>


            <!-- TITLE -->

            <h2 class="page-title">
                Manage Products
            </h2>

        </div>



        <!-- =========================================
             PRODUCT BOX
             ========================================= -->

        <div class="product-box">


            <!-- MOBILE SCROLL HINT -->

            <div class="scroll-hint">

                <i class="fa-solid fa-arrows-left-right"></i>

                Swipe left/right to view the complete table

            </div>



            <!-- =========================================
                 TABLE
                 ========================================= -->

            <div class="table-responsive">

                <table class="table table-hover align-middle">


                    <!-- TABLE HEADER -->

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Image</th>

                            <th>Product</th>

                            <th>Brand</th>

                            <th>Category</th>

                            <th>Price</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <!-- TABLE BODY -->

                    <tbody id="productsTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script>

        const productsTableBody =
            document.getElementById("productsTableBody");


        // =========================================
        // RAILWAY BACKEND URL
        // =========================================

        const API_URL =
            "https://affectionate-spontaneity-production-044d.up.railway.app/api/products";


        // =========================================
        // LOAD PRODUCTS
        // =========================================

        function loadProducts() {

            fetch(API_URL)

                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to load products"
                        );

                    }

                    return response.json();

                })


                .then(products => {

                    productsTableBody.innerHTML = "";


                    // =================================
                    // NO PRODUCTS
                    // =================================

                    if (products.length === 0) {

                        productsTableBody.innerHTML = `

                            <tr>

                                <td
                                    colspan="7"
                                    class="text-center py-4">

                                    <i
                                        class="fa-solid fa-box-open"
                                        style="
                                            font-size:35px;
                                            color:#ff4f87;
                                        ">
                                    </i>

                                    <br><br>

                                    No products found.

                                </td>

                            </tr>

                        `;

                        return;
                    }


                    // =================================
                    // DISPLAY PRODUCTS
                    // =================================

                    products.forEach(product => {


                        /*
                         * IMAGE URL
                         *
                         * If database contains:
                         *
                         * uploads/abc.jpg
                         *
                         * use Railway backend.
                         *
                         * Otherwise:
                         *
                         * images/abc.jpg
                         *
                         * for your frontend images folder.
                         */

                        let imageUrl;


                        if (product.image) {

                            if (
                                product.image.startsWith("uploads/")
                            ) {

                                imageUrl =
                                    "https://affectionate-spontaneity-production-044d.up.railway.app/"
                                    + product.image;

                            } else {

                                imageUrl =
                                    "images/"
                                    + product.image;

                            }

                        } else {

                            imageUrl =
                                "images/default-product.jpg";

                        }


                        // =================================
                        // CREATE ROW
                        // =================================

                        const row = `

                            <tr>


                                <!-- ID -->

                                <td>

                                    <strong>
                                        ${product.id}
                                    </strong>

                                </td>



                                <!-- IMAGE -->

                                <td>

                                    <img
                                        src="${imageUrl}"
                                        alt="${product.name || "Product"}"
                                        class="product-image"

                                        onerror="
                                            this.src='images/default-product.jpg';
                                        ">

                                </td>



                                <!-- PRODUCT -->

                                <td>

                                    ${product.name || "—"}

                                </td>



                                <!-- BRAND -->

                                <td>

                                    ${product.brand || "—"}

                                </td>



                                <!-- CATEGORY -->

                                <td>

                                    ${product.category || "—"}

                                </td>



                                <!-- PRICE -->

                                <td>

                                    <strong>
                                        ₹${product.price || 0}
                                    </strong>

                                </td>



                                <!-- ACTION -->

                                <td>

                                    <button
                                        class="btn btn-edit btn-sm"
                                        onclick="editProduct(${product.id})">

                                        <i class="fa-solid fa-pen"></i>

                                        Edit

                                    </button>


                                    <button
                                        class="btn btn-delete btn-sm"
                                        onclick="deleteProduct(${product.id})">

                                        <i class="fa-solid fa-trash"></i>

                                        Delete

                                    </button>

                                </td>


                            </tr>

                        `;


                        productsTableBody.innerHTML += row;

                    });

                })


                .catch(error => {

                    console.error(
                        "Error loading products:",
                        error
                    );


                    productsTableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="7"
                                class="text-center text-danger py-4">

                                <i
                                    class="fa-solid fa-circle-exclamation">
                                </i>

                                <br><br>

                                Unable to load products.

                                <br>

                                <small>
                                    Make sure the Railway backend is running.
                                </small>

                            </td>

                        </tr>

                    `;

                });

        }



        // =========================================
        // DELETE PRODUCT
        // =========================================

        function deleteProduct(id) {

            const confirmDelete = confirm(
                "Are you sure you want to delete this product?"
            );


            if (!confirmDelete) {

                return;

            }


            fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE"
                }
            )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to delete product"
                    );

                }

                return response.text();

            })


            .then(() => {

                alert(
                    "Product deleted successfully!"
                );

                loadProducts();

            })


            .catch(error => {

                console.error(
                    "Error deleting product:",
                    error
                );

                alert(
                    "Unable to delete product."
                );

            });

        }



        // =========================================
        // EDIT PRODUCT
        // =========================================

        function editProduct(id) {


            fetch(`${API_URL}/${id}`)


                .then(response => {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to get product"
                        );

                    }

                    return response.json();

                })


                .then(product => {


                    // =================================
                    // PRODUCT NAME
                    // =================================

                    const name = prompt(
                        "Product Name:",
                        product.name
                    );


                    if (name === null) {

                        return;

                    }


                    // =================================
                    // BRAND
                    // =================================

                    const brand = prompt(
                        "Brand:",
                        product.brand
                    );


                    if (brand === null) {

                        return;

                    }


                    // =================================
                    // PRICE
                    // =================================

                    const price = prompt(
                        "Price:",
                        product.price
                    );


                    if (price === null) {

                        return;

                    }


                    const numericPrice =
                        parseFloat(price);


                    if (
                        isNaN(numericPrice) ||
                        numericPrice < 0
                    ) {

                        alert(
                            "Please enter a valid price."
                        );

                        return;

                    }


                    // =================================
                    // CATEGORY
                    // =================================

                    const category = prompt(
                        "Category:",
                        product.category
                    );


                    if (category === null) {

                        return;

                    }


                    // =================================
                    // IMAGE
                    // =================================

                    const image = prompt(
                        "Image filename:",
                        product.image
                    );


                    if (image === null) {

                        return;

                    }


                    // =================================
                    // UPDATED PRODUCT
                    // =================================

                    const updatedProduct = {

                        name: name,

                        brand: brand,

                        price: numericPrice,

                        category: category,

                        image: image

                    };


                    // =================================
                    // SEND PUT REQUEST
                    // =================================

                    return fetch(
                        `${API_URL}/${id}`,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    updatedProduct
                                )

                        }

                    );

                })


                .then(response => {

                    if (!response) {

                        return;

                    }


                    if (!response.ok) {

                        throw new Error(
                            "Failed to update product"
                        );

                    }


                    return response.json();

                })


                .then(() => {

                    alert(
                        "Product updated successfully!"
                    );

                    loadProducts();

                })


                .catch(error => {

                    console.error(
                        "Error updating product:",
                        error
                    );

                    alert(
                        "Unable to update product."
                    );

                });

        }



        // =========================================
        // START PAGE
        // =========================================

        loadProducts();

    </script>



    <!-- THEME -->

    <script src="js/theme.js"></script>


</body>

</html>
