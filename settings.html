<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | BlushBerry</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================
           BODY
           ========================= */

        body {

            background: #fff8fb;

            font-family: Arial, sans-serif;

            transition:
                background 0.3s,
                color 0.3s;

        }


        /* =========================
           NAVBAR
           ========================= */

        .navbar {

            background: white;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, .08);

        }


        .navbar-brand {

            color: #f83f76;

            font-size: 30px;

            font-weight: bold;

            text-decoration: none;

        }


        .navbar-brand:hover {

            color: #f83f76;

        }


        /* =========================
           GO BACK BUTTON
           ========================= */

        .bb-back-btn {

            display: inline-block;

            background: #fff8fb;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            border-radius: 12px;

            padding: 8px 15px;

            font-size: 16px;

            font-weight: 500;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.2s ease;

        }


        .bb-back-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }


        .bb-back-btn:active {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

        }


        .bb-back-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        /* =========================
           PAGE TITLE
           ========================= */

        .page-title {

            text-align: center;

            margin: 40px 0;

            color: #f83f76;

            font-weight: bold;

        }


        /* =========================
           SETTING CARD
           ========================= */

        .setting-card {

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, .08);

            margin-bottom: 25px;

            transition: .3s;

        }


        .setting-card:hover {

            transform: translateY(-5px);

        }


        .setting-card i {

            font-size: 28px;

            color: #f83f76;

            margin-right: 15px;

        }


        .setting-card h5 {

            margin-bottom: 10px;

            font-weight: bold;

        }


        .setting-card p {

            color: #777;

            margin-bottom: 20px;

        }


        /* =========================
           ACTION BUTTON
           ========================= */

        .action-btn {

            background: #fff8fb;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            border-radius: 12px;

            padding: 10px 25px;

            font-weight: 500;

            transition: all 0.2s ease;

        }


        .action-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

        }


        .action-btn:active {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

        }


        .action-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            outline: none;

            box-shadow:
                0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        /* =========================
           LOGOUT
           ========================= */

        .logout-btn {

            background: #f83f76;

            color: white;

            padding: 15px 40px;

            border-radius: 35px;

            font-size: 18px;

            font-weight: bold;

            border: none;

            text-decoration: none;

            transition: all 0.2s ease;

        }


        .logout-btn:hover {

            background: #f83f76;

            color: white;

            box-shadow:
                0 5px 15px rgba(248, 63, 118, 0.25);

        }


        .logout-btn:active {

            background: #f83f76;

            color: white;

        }


        /* =========================
           TOGGLE SWITCH
           ========================= */

        .form-check-input:checked {

            background-color: #f83f76;

            border-color: #f83f76;

        }


        .form-check-input:focus {

            border-color: #f83f76;

            box-shadow:
                0 0 0 0.25rem rgba(248, 63, 118, 0.20);

        }


        /* =========================
           FOOTER SPACE
           ========================= */

        .footer-space {

            height: 50px;

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
         ========================= -->

    <nav class="navbar navbar-expand-lg">

        <div class="container">


            <a class="navbar-brand" href="index.html">

                🌸 BlushBerry

            </a>


            <a href="profile.html"
               class="bb-back-btn">

                ← Go Back

            </a>

        </div>

    </nav>



    <!-- =========================
         MAIN
         ========================= -->

    <div class="container">


        <h2 class="page-title">

            ⚙️ Account Settings

        </h2>



        <!-- =========================
             EDIT PROFILE
             ========================= -->

        <div class="setting-card">

            <h5>

                <i class="fa-solid fa-user-pen"></i>

                Edit Profile

            </h5>


            <p>

                Update your name, email and profile picture.

            </p>


            <button
                class="btn action-btn"
                onclick="editProfile()">

                Edit

            </button>

        </div>



        <!-- =========================
             CHANGE PASSWORD
             ========================= -->

        <div class="setting-card">

            <h5>

                <i class="fa-solid fa-lock"></i>

                Change Password

            </h5>


            <p>

                Keep your account secure by updating your password.

            </p>


            <button
                class="btn action-btn"
                onclick="changePassword()">

                Change

            </button>

        </div>



        <!-- =========================
             NOTIFICATIONS
             ========================= -->

        <div class="setting-card">

            <h5>

                <i class="fa-solid fa-bell"></i>

                Notifications

            </h5>


            <p>

                Manage email and order notifications.

            </p>


            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="notificationToggle">


                <label
                    class="form-check-label"
                    for="notificationToggle">

                    Enable Notifications

                </label>

            </div>

        </div>



        <!-- =========================
             DARK MODE
             ========================= -->

        <div class="setting-card">

            <h5>

                <i class="fa-solid fa-moon"></i>

                Dark Mode

            </h5>


            <p>

                Apply dark mode across the BlushBerry website.

            </p>


            <div class="form-check form-switch">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="darkModeToggle"
                    onchange="toggleDarkMode()">


                <label
                    class="form-check-label"
                    for="darkModeToggle">

                    Dark Mode

                </label>

            </div>

        </div>



        <!-- =========================
             LOGOUT
             ========================= -->

        <div class="text-center mt-5">

            <a
                href="login.html"
                class="btn logout-btn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </a>

        </div>


        <div class="footer-space"></div>

    </div>



    <!-- =========================
         THEME SCRIPT
         ========================= -->

    <script src="js/theme.js"></script>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>


        /* =========================
           DARK MODE CHECKBOX
           ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const darkModeToggle =
                    document.getElementById(
                        "darkModeToggle"
                    );


                if (
                    localStorage.getItem(
                        "darkMode"
                    ) === "enabled"
                ) {

                    darkModeToggle.checked = true;

                }

            }
        );



        /* =========================
           EDIT PROFILE
           ========================= */

        function editProfile() {

            window.location.href =
                "edit-profile.html";

        }



        /* =========================
           CHANGE PASSWORD
           ========================= */

        function changePassword() {

            const newPassword =
                prompt(
                    "Enter your new password:"
                );


            if (
                newPassword !== null &&
                newPassword.trim() !== ""
            ) {

                localStorage.setItem(
                    "userPassword",
                    newPassword
                );


                alert(
                    "Password changed successfully! ✅"
                );

            }

        }



        /* =========================
           NOTIFICATIONS
           ========================= */

        const notificationToggle =
            document.getElementById(
                "notificationToggle"
            );


        const savedNotification =
            localStorage.getItem(
                "notifications"
            );


        if (
            savedNotification === "disabled"
        ) {

            notificationToggle.checked = false;

        }

        else {

            notificationToggle.checked = true;

        }


        notificationToggle.addEventListener(
            "change",
            function () {

                if (
                    notificationToggle.checked
                ) {

                    localStorage.setItem(
                        "notifications",
                        "enabled"
                    );

                }

                else {

                    localStorage.setItem(
                        "notifications",
                        "disabled"
                    );

                }

            }
        );


    </script>


</body>

</html>
