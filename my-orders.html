<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | BlushBerry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background: #fffafc;
            font-family: Arial, sans-serif;
        }

        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: white;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .1);
        }

        .navbar-brand {
            color: #f83f76;
            font-size: 30px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: #f83f76;
        }


        /* =========================
           BLUSHBERRY BUTTON
           ========================= */

        .bb-btn {

            display: inline-block;

            background: #fffafc;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            padding: 10px 22px;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 500;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.2s ease;

        }

        .bb-btn:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            text-decoration: none;

        }

        .bb-btn:active {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

        }

        .bb-btn:focus {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

            box-shadow: 0 0 0 3px rgba(248, 63, 118, 0.20);

        }


        /* =========================
           ORDER CARD
           ========================= */

        .order-card {

            background: white;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }


        /* =========================
           PRODUCT IMAGE
           ========================= */

        .product-img {

            width: 90px;

            height: 90px;

            object-fit: cover;

            border-radius: 10px;

        }


        /* =========================
           STATUS
           ========================= */

        .status {
            font-weight: bold;
        }

        .delivered {
            color: green;
        }

        .processing {
            color: orange;
        }

        .cancelled {
            color: red;
        }

        .shipped {
            color: #007bff;
        }


        /* =========================
           VIEW DETAILS BUTTON
           ========================= */

        .btn-details {

            background: #fffafc;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            border-radius: 12px;

            padding: 8px 15px;

            font-weight: 500;

            transition: all 0.2s ease;

        }

        .btn-details:hover {

            background: #f83f76;

            color: white;

            border-color: #f83f76;

        }

        .btn-details:active {

            background: #f83f76 !important;

            color: white !important;

            border-color: #f83f76 !important;

        }


        /* =========================
           EMPTY ORDERS
           ========================= */

        .empty-orders {

            background: white;

            border-radius: 20px;

            padding: 50px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }


        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 768px) {

            .navbar-brand {
                font-size: 25px;
            }

            .product-img {
                margin-bottom: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
     ========================= -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            🌸 BlushBerry
        </a>

        <a href="profile.html" class="bb-btn ms-auto">
            ← Go Back
        </a>

    </div>

</nav>


<!-- =========================
     MY ORDERS
     ========================= -->

<div class="container mt-5">

    <h2 class="mb-4">
        📦 My Orders
    </h2>

    <div id="ordersContainer">

        <p class="text-center">
            Loading orders...
        </p>

    </div>

</div>


<!-- =========================
     JAVASCRIPT
     ========================= -->

<script>

const ordersContainer =
    document.getElementById("ordersContainer");


function loadOrders() {

    fetch("http://localhost:8080/api/orders")

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to load orders"
                );

            }

            return response.json();

        })

        .then(orders => {

            ordersContainer.innerHTML = "";


            /* =========================
               NO ORDERS
               ========================= */

            if (orders.length === 0) {

                ordersContainer.innerHTML = `

                    <div class="empty-orders">

                        <h4>
                            📦 No Orders Yet
                        </h4>

                        <p>
                            You haven't placed any orders yet.
                        </p>

                        <a href="products.html"
                           class="btn btn-details">

                            Start Shopping

                        </a>

                    </div>

                `;

                return;

            }


            /* =========================
               LATEST ORDERS FIRST
               ========================= */

            orders.reverse();


            /* =========================
               DISPLAY ORDERS
               ========================= */

            orders.forEach(order => {


                const status =
                    order.status || "Processing";


                let statusClass =
                    "processing";


                if (status === "Delivered") {

                    statusClass = "delivered";

                }

                else if (status === "Shipped") {

                    statusClass = "shipped";

                }

                else if (status === "Cancelled") {

                    statusClass = "cancelled";

                }


                /* =========================
                   PRODUCT IMAGE
                   ========================= */

                const image =

                    order.productImage

                    ?

                    (

                        order.productImage.startsWith(
                            "uploads/"
                        )

                        ?

                        "http://localhost:8080/" +
                        order.productImage

                        :

                        "images/" +
                        order.productImage

                    )

                    :

                    "images/pfp.jpg";


                const productName =

                    order.productName ||

                    "BlushBerry Order";


                /* =========================
                   ORDER CARD
                   ========================= */

                const card = `

                    <div class="order-card">

                        <div class="row align-items-center">


                            <!-- PRODUCT IMAGE -->

                            <div class="col-md-2">

                                <img

                                    src="${image}"

                                    class="product-img"

                                    alt="${productName}"

                                    onerror="
                                        this.onerror=null;
                                        this.src='images/pfp.jpg';
                                    "

                                >

                            </div>


                            <!-- PRODUCT DETAILS -->

                            <div class="col-md-4">

                                <h5>
                                    ${productName}
                                </h5>

                                <p>
                                    Order ID:
                                    #${order.id}
                                </p>

                                <p>
                                    Customer:
                                    ${order.customerName || "Customer"}
                                </p>

                            </div>


                            <!-- PRICE -->

                            <div class="col-md-2">

                                <h5>
                                    ₹${order.totalAmount}
                                </h5>

                            </div>


                            <!-- STATUS -->

                            <div class="col-md-2">

                                <p class="status ${statusClass}">

                                    ${status}

                                </p>

                            </div>


                            <!-- DETAILS BUTTON -->

                            <div class="col-md-2">

                                <button

                                    class="btn btn-details"

                                    onclick="
                                        viewOrderDetails(${order.id})
                                    "

                                >

                                    View Details

                                </button>

                            </div>


                        </div>

                    </div>

                `;


                ordersContainer.innerHTML += card;

            });

        })


        /* =========================
           ERROR
           ========================= */

        .catch(error => {

            console.error(
                "Error loading orders:",
                error
            );


            ordersContainer.innerHTML = `

                <div class="empty-orders">

                    <h4>
                        ❌ Unable to Load Orders
                    </h4>

                    <p>
                        Please make sure
                        Spring Boot is running.
                    </p>

                    <a href="products.html"
                       class="btn btn-details">

                        Continue Shopping

                    </a>

                </div>

            `;

        });

}


/* =========================
   VIEW ORDER DETAILS
   ========================= */

function viewOrderDetails(orderId) {

    window.location.href =
        "order-details.html?id=" + orderId;

}


/* =========================
   LOAD ORDERS
   ========================= */

loadOrders();

</script>


<script src="js/theme.js"></script>


</body>

</html>
