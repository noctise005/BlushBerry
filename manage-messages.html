<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Messages | BlushBerry</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        body {

            background: #fff8fb;

            font-family: Arial, sans-serif;

        }


        .container {

            margin-top: 40px;

            margin-bottom: 50px;

        }


        /* TOP BAR */

        .top-bar {

            position: relative;

            margin-bottom: 50px;

        }


        /* GO BACK */

        .back-btn {

            position: absolute;

            left: 0;

            top: 50%;

            transform: translateY(-50%);

            background: #fffafc;

            color: #f83f76;

            border: 1.5px solid #f83f76;

            text-decoration: none;

            padding: 10px 22px;

            border-radius: 12px;

            font-weight: 500;

            transition: .2s;

        }


        .back-btn:hover {

            background: #f83f76;

            color: white;

        }


        /* TITLE */

        .top-bar h2 {

            text-align: center;

            color: #ff4f87;

            font-size: 42px;

            font-weight: 700;

            margin: 0;

            line-height: 60px;

        }


        /* MESSAGE BOX */

        .message-box {

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, .08);

        }


        /* TABLE */

        .table {

            margin-bottom: 0;

        }


        .table th {

            white-space: nowrap;

        }


        .message-text {

            max-width: 350px;

            word-wrap: break-word;

        }


        /* VIEW BUTTON */

        .btn-view {

            background: #ff7aa8;

            color: white;

            border: none;

        }


        .btn-view:hover {

            background: #ff5d8f;

            color: white;

        }


        /* DELETE BUTTON */

        .btn-delete {

            background: #dc3545;

            color: white;

            border: none;

        }


        .btn-delete:hover {

            background: #bb2d3b;

            color: white;

        }


        /* EMPTY */

        .empty-message {

            text-align: center;

            padding: 40px;

            color: #777;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- TOP BAR -->

    <div class="top-bar">


        <a
            href="admin-dashboard.html"
            class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Go Back

        </a>


        <h2>

            Manage Messages

        </h2>


    </div>



    <!-- MESSAGE TABLE -->

    <div class="message-box">


        <div class="table-responsive">


            <table class="table table-hover align-middle">


                <thead class="table-light">


                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Message</th>

                        <th>Action</th>

                    </tr>


                </thead>


                <tbody id="messagesTableBody">

                </tbody>


            </table>


        </div>


    </div>


</div>



<script>


    const messagesTableBody =
        document.getElementById(
            "messagesTableBody"
        );



    let allMessages = [];



    // =====================================
    // LOAD MESSAGES
    // =====================================

    function loadMessages() {


        fetch("https://affectionate-spontaneity-production-044d.up.railway.app/api/contact")


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Failed to load messages"
                    );

                }


                return response.json();

            })


            .then(messages => {


                allMessages = messages;


                messagesTableBody.innerHTML = "";


                // NO MESSAGES

                if (messages.length === 0) {


                    messagesTableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                class="empty-message">

                                <i
                                    class="fa-solid fa-envelope-open-text"
                                    style="font-size:40px;color:#ff4f87;">
                                </i>

                                <br><br>

                                No messages found.

                            </td>

                        </tr>

                    `;


                    return;

                }



                // DISPLAY MESSAGES

                messages.forEach(
                    (message, index) => {


                    const row = `

                        <tr>


                            <td>

                                ${index + 1}

                            </td>


                            <td>

                                ${message.name}

                            </td>


                            <td>

                                ${message.email}

                            </td>


                            <td
                                class="message-text">

                                ${message.message}

                            </td>


                            <td>


                                <button
                                    class="btn btn-view btn-sm"
                                    onclick="viewMessage(${index})">

                                    <i
                                        class="fa-solid fa-eye">
                                    </i>

                                    View

                                </button>


                                <button
                                    class="btn btn-delete btn-sm"
                                    onclick="deleteMessage(${index})">

                                    <i
                                        class="fa-solid fa-trash">
                                    </i>

                                    Delete

                                </button>


                            </td>


                        </tr>

                    `;


                    messagesTableBody.innerHTML += row;


                });

            })


            .catch(error => {


                console.error(
                    "Error loading messages:",
                    error
                );


                messagesTableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="5"
                            class="text-center text-danger p-4">

                            Unable to load messages.

                        </td>

                    </tr>

                `;

            });

    }



    // =====================================
    // VIEW MESSAGE
    // =====================================

    function viewMessage(index) {


        const message =
            allMessages[index];


        if (!message) {

            return;

        }


        alert(

            "Customer Message\n\n" +

            "Name: " +
            message.name +

            "\n\nEmail: " +
            message.email +

            "\n\nMessage:\n" +
            message.message

        );

    }



    // =====================================
    // DELETE MESSAGE
    // =====================================

    function deleteMessage(index) {


        const message =
            allMessages[index];


        if (!message) {

            return;

        }


        const confirmDelete =
            confirm(

                "Delete this message from " +
                message.name +
                "?"

            );


        if (!confirmDelete) {

            return;

        }


        /*
         * DELETE REQUEST
         *
         * This will work after we add
         * DELETE support to ContactController.
         */

        fetch(
            "https://affectionate-spontaneity-production-044d.up.railway.app/api/contact" +
            message.id,
            {

                method: "DELETE"

            }

        )


        .then(response => {


            if (!response.ok) {

                throw new Error(
                    "Failed to delete message"
                );

            }


            alert(
                "Message deleted successfully."
            );


            loadMessages();

        })


        .catch(error => {


            console.error(
                "Delete error:",
                error
            );


            alert(
                "Unable to delete message."
            );

        });

    }



    // =====================================
    // LOAD PAGE
    // =====================================

    loadMessages();


</script>


<script src="js/theme.js"></script>


</body>

</html>
