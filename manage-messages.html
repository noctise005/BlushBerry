<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Messages | BlushBerry</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================
           BODY
           ========================= */

        body {
            background: #fff8fb;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }


        /* =========================
           MAIN CONTAINER
           ========================= */

        .main-container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 50px;
            padding: 0 20px;
        }


        /* =========================
           TOP BAR
           ========================= */

        .top-bar {
            position: relative;
            min-height: 75px;
            margin-bottom: 45px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           GO BACK BUTTON
           ========================= */

        .back-btn {

            position: absolute;
            left: 0;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            background: #fffafc;
            color: #f83f76;

            border: 1.5px solid #f83f76;

            text-decoration: none;

            padding: 10px 22px;

            border-radius: 12px;

            font-size: 16px;
            font-weight: 500;

            transition: all 0.2s ease;
        }


        .back-btn:hover {

            background: #f83f76;
            color: white;

            border-color: #f83f76;

            text-decoration: none;

            transform: translateY(-1px);
        }


        /* =========================
           PAGE TITLE
           ========================= */

        .top-bar h2 {

            color: #ff4f87;

            font-size: 42px;
            font-weight: 700;

            margin: 0;

            text-align: center;
        }


        /* =========================
           MESSAGE BOX
           ========================= */

        .message-box {

            width: 100%;

            background: white;

            padding: 25px;

            border-radius: 20px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);
        }


        /* =========================
           TABLE
           ========================= */

        .table-responsive {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }


        .table {

            margin-bottom: 0;

            min-width: 750px;
        }


        .table th {

            white-space: nowrap;

            font-weight: 600;
        }


        .table td {

            vertical-align: middle;
        }


        /* =========================
           MESSAGE TEXT
           ========================= */

        .message-text {

            max-width: 350px;

            word-break: break-word;
            overflow-wrap: break-word;
        }


        /* =========================
           VIEW BUTTON
           ========================= */

        .btn-view {

            background: #ff7aa8;

            color: white;

            border: none;

            border-radius: 8px;

            padding: 6px 14px;

            margin-right: 5px;

            transition: 0.2s ease;
        }


        .btn-view:hover {

            background: #ff5d8f;

            color: white;

            transform: translateY(-1px);
        }


        /* =========================
           DELETE BUTTON
           ========================= */

        .btn-delete {

            background: #dc3545;

            color: white;

            border: none;

            border-radius: 8px;

            padding: 6px 14px;

            transition: 0.2s ease;
        }


        .btn-delete:hover {

            background: #bb2d3b;

            color: white;

            transform: translateY(-1px);
        }


        /* =========================
           EMPTY MESSAGE
           ========================= */

        .empty-message {

            text-align: center;

            padding: 40px;

            color: #777;
        }


        /* =========================
           TABLET
           ========================= */

        @media (max-width: 768px) {

            .main-container {

                margin-top: 25px;

                padding: 0 15px;
            }


            .top-bar {

                min-height: auto;

                display: flex;

                flex-direction: column;

                align-items: stretch;

                gap: 20px;

                margin-bottom: 30px;
            }


            .back-btn {

                position: static;

                align-self: flex-start;

                width: auto;
            }


            .top-bar h2 {

                font-size: 32px;

                text-align: center;
            }


            .message-box {

                padding: 15px;

                border-radius: 16px;
            }

        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 576px) {

            .main-container {

                margin-top: 20px;

                margin-bottom: 30px;

                padding: 0 10px;
            }


            .top-bar {

                gap: 15px;

                margin-bottom: 25px;
            }


            .back-btn {

                width: fit-content;

                padding: 9px 16px;

                font-size: 14px;

                border-radius: 10px;
            }


            .top-bar h2 {

                font-size: 27px;

                line-height: 1.2;

                padding: 0 5px;
            }


            .message-box {

                padding: 10px;

                border-radius: 15px;
            }


            .table {

                min-width: 700px;

                font-size: 14px;
            }


            .table th,
            .table td {

                padding: 10px 8px;
            }


            .btn-view,
            .btn-delete {

                font-size: 13px;

                padding: 6px 10px;

                margin-bottom: 4px;
            }


            .message-text {

                max-width: 280px;
            }

        }


        /* =========================
           VERY SMALL MOBILE
           ========================= */

        @media (max-width: 400px) {

            .top-bar h2 {

                font-size: 24px;
            }


            .back-btn {

                font-size: 13px;

                padding: 8px 13px;
            }


            .message-box {

                padding: 8px;
            }


            .table {

                font-size: 13px;

                min-width: 650px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN CONTAINER
         ========================= -->

    <div class="main-container">


        <!-- =========================
             TOP BAR
             ========================= -->

        <div class="top-bar">


            <!-- GO BACK -->

            <a
                href="admin-dashboard.html"
                class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Go Back

            </a>


            <!-- TITLE -->

            <h2>

                Manage Messages

            </h2>


        </div>


        <!-- =========================
             MESSAGE TABLE
             ========================= -->

        <div class="message-box">


            <div class="table-responsive">


                <table class="table table-hover align-middle">


                    <thead class="table-light">

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Message</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="messagesTableBody">

                    </tbody>


                </table>


            </div>


        </div>


    </div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>


        const messagesTableBody =
            document.getElementById("messagesTableBody");


        let allMessages = [];


        /* =========================
           LOAD MESSAGES
           ========================= */

        function loadMessages() {

            fetch(
                "https://affectionate-spontaneity-production-044d.up.railway.app/api/contact"
            )

            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to load messages"
                    );

                }

                return response.json();

            })

            .then(messages => {

                allMessages = messages;

                messagesTableBody.innerHTML = "";


                /* =========================
                   NO MESSAGES
                   ========================= */

                if (messages.length === 0) {

                    messagesTableBody.innerHTML = `

                        <tr>

                            <td
                                colspan="5"
                                class="empty-message">

                                <i
                                    class="fa-solid fa-envelope-open-text"
                                    style="
                                        font-size:40px;
                                        color:#ff4f87;
                                    ">
                                </i>

                                <br><br>

                                No messages found.

                            </td>

                        </tr>

                    `;

                    return;
                }


                /* =========================
                   DISPLAY MESSAGES
                   ========================= */

                messages.forEach(
                    (message, index) => {

                        const row = `

                            <tr>

                                <td>
                                    ${index + 1}
                                </td>


                                <td>
                                    ${message.name || "Unknown"}
                                </td>


                                <td>
                                    ${message.email || "Not available"}
                                </td>


                                <td class="message-text">

                                    ${message.message || "No message"}

                                </td>


                                <td>

                                    <button
                                        class="btn btn-view btn-sm"
                                        onclick="viewMessage(${index})">

                                        <i class="fa-solid fa-eye"></i>

                                        View

                                    </button>


                                    <button
                                        class="btn btn-delete btn-sm"
                                        onclick="deleteMessage(${index})">

                                        <i class="fa-solid fa-trash"></i>

                                        Delete

                                    </button>

                                </td>

                            </tr>

                        `;


                        messagesTableBody.innerHTML += row;

                    }
                );

            })


            .catch(error => {

                console.error(
                    "Error loading messages:",
                    error
                );


                messagesTableBody.innerHTML = `

                    <tr>

                        <td
                            colspan="5"
                            class="text-center text-danger p-4">

                            <i
                                class="fa-solid fa-circle-exclamation">
                            </i>

                            <br>

                            Unable to load messages.

                            <br>

                            <small>

                                Make sure Spring Boot is running.

                            </small>

                        </td>

                    </tr>

                `;

            });

        }


        /* =========================
           VIEW MESSAGE
           ========================= */

        function viewMessage(index) {

            const message =
                allMessages[index];


            if (!message) {

                return;

            }


            alert(

                "Customer Message\n\n" +

                "Name: " +
                (message.name || "Unknown") +

                "\n\n" +

                "Email: " +
                (message.email || "Not available") +

                "\n\n" +

                "Message:\n" +
                (message.message || "No message")

            );

        }


        /* =========================
           DELETE MESSAGE
           ========================= */

        function deleteMessage(index) {

            const message =
                allMessages[index];


            if (!message) {

                return;

            }


            const confirmDelete =
                confirm(
                    "Delete this message from " +
                    message.name +
                    "?"
                );


            if (!confirmDelete) {

                return;

            }


            /* =========================
               DELETE REQUEST
               ========================= */

            fetch(

                "https://affectionate-spontaneity-production-044d.up.railway.app/api/contact/" +
                message.id,

                {
                    method: "DELETE"
                }

            )


            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        "Failed to delete message"
                    );

                }


                alert(
                    "Message deleted successfully."
                );


                loadMessages();

            })


            .catch(error => {

                console.error(
                    "Delete error:",
                    error
                );


                alert(
                    "Unable to delete message."
                );

            });

        }


        /* =========================
           LOAD PAGE
           ========================= */

        loadMessages();


    </script>


    <!-- THEME -->

    <script src="js/theme.js"></script>


</body>

</html>
